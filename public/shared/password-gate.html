<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>{{title}} - {{site_name}}</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#FCFBF8;color:#1C1917;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:380px;background:#FFFFFF;border:1px solid #E6E2D8;border-radius:16px;padding:28px 24px;box-shadow:0 10px 30px rgba(28,25,23,.06)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:#FEF3C7;color:{{accent}};margin-bottom:14px}
h1{margin:0 0 8px;font-size:18px;font-weight:700;line-height:1.3}
p.desc{margin:0 0 18px;font-size:13px;line-height:1.6;color:#78716C}
form{display:flex;flex-direction:column;gap:12px}
input[type="password"]{width:100%;height:40px;padding:0 12px;border:1px solid #E6E2D8;border-radius:10px;background:#FCFBF8;color:#1C1917;font-size:15px;letter-spacing:.12em;outline:none}
input[type="password"]:focus{border-color:{{accent}}}
button{height:40px;border:0;border-radius:10px;background:{{accent}};color:#fff;font-size:13px;font-weight:700;cursor:pointer}
button:hover{opacity:.92}
p.err{margin:0;font-size:12px;font-weight:600;color:#DC2626}
</style>
</head>
<body>
<main class="card">
<div class="badge" aria-hidden="true">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
</div>
<h1>{{title}}</h1>
<p class="desc">{{desc}}</p>
<form method="POST" action="/_unlock">
<input type="hidden" name="node_id" value="{{node_id}}" />
<input type="hidden" name="path" value="{{target_path}}" />
<input type="password" name="password" placeholder="{{placeholder}}" autocomplete="current-password" autofocus required />
{{error_html}}
<button type="submit">{{submit_label}}</button>
</form>
</main>
</body>
</html>
