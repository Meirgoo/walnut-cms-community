<!DOCTYPE html>
<html lang="{{locale}}" class="h-full w-full" style="height: 100%; min-height: 100vh; width: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="provider" content="{{provider_name}}">
  <meta name="generator" content="{{provider_name}}">
  <title>{{login_title}} - {{system_title}}</title>
  <link rel="stylesheet" href="/shared/app.css" />
  <link rel="stylesheet" href="/admin/palettes.css" />
  <script src="/shared/htmx.min.js"></script>
  {{inline_i18n_script}}
  <script src="/shared/theme-init.js"></script>
</head>
<body class="admin-ambient-canvas bg-[var(--admin-canvas)] text-[var(--admin-text)] flex flex-col items-center justify-center min-h-screen w-full p-4 antialiased" style="min-height: 100vh; width: 100%; margin: 0;">
  <div class="bg-[var(--admin-surface)] p-8 rounded-2xl shadow-xl w-full max-w-sm border border-[var(--admin-border)] my-auto" style="margin-top: auto !important; margin-bottom: auto !important;">
    <div class="pb-5 mb-6 border-b border-[var(--admin-border)] flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-lg font-bold text-[var(--admin-text)] tracking-tight">{{login_title}}</h1>
        <p class="text-xs text-[var(--admin-text-muted)] mt-0.5">{{login_subtitle}}</p>
      </div>
      <edge-select
          onchange="window.location.href='/admin/switch-locale?locale=' + this.value + '&redirect=/admin/login'"
          class="h-7 bg-[var(--admin-surface)] text-[var(--admin-text)] text-xs font-medium rounded-lg px-2 border border-[var(--admin-border)] outline-none cursor-pointer shrink-0"
      >
          {{login_locale_options_html}}
      </edge-select>
    </div>

    <div class="mb-6 p-4 bg-[var(--admin-accent-soft)] border border-[var(--admin-accent-border)] rounded-lg text-center space-y-2 {{cf_block_class}}">
        <div class="text-xs font-bold text-[var(--admin-accent-text)]">{{cf_detected}}</div>
        <div class="text-xs font-mono text-[var(--admin-text-muted)] truncate {{cf_email_class}}">{{cf_email}}</div>
        <a href="/admin/auth/cf-access" hx-boost="false" class="inline-flex items-center justify-center w-full h-8 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] font-semibold text-xs rounded-lg transition">
            {{cf_btn}} &rarr;
        </a>
    </div>
    <div class="flex items-center my-4 {{cf_block_class}}">
        <div class="flex-grow border-t border-[var(--admin-border)]"></div>
        <span class="px-2 text-[10px] font-bold text-[var(--admin-text-muted)] uppercase">{{or_password}}</span>
        <div class="flex-grow border-t border-[var(--admin-border)]"></div>
    </div>

    <form hx-post="/admin/api/login" hx-target="#error-msg" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1.5">{{field_username}}</label>
        <input type="text" name="username" required class="w-full h-9 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-3 text-xs font-medium focus:border-[var(--admin-accent)] outline-none text-[var(--admin-text)]" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1.5">{{field_password}}</label>
        <input type="password" name="password" required class="w-full h-9 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-3 text-xs font-medium focus:border-[var(--admin-accent)] outline-none text-[var(--admin-text)]" />
      </div>
      <div id="error-msg" class="text-[var(--admin-danger)] text-xs font-semibold min-h-[1rem]">{{error}}</div>
      <button type="submit" class="w-full h-9 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] font-semibold text-[13px] px-4 rounded-lg shadow-sm transition cursor-pointer">
        {{btn_submit}}
      </button>
    </form>
  </div>
  <script src="/admin/js/edge-select.js"></script>
</body>
</html>
