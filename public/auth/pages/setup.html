<!DOCTYPE html>
<html lang="{{locale}}" class="h-full w-full" style="height: 100%; min-height: 100vh; width: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/shared/app.css" />
    <link rel="stylesheet" href="/admin/palettes.css" />
    <link rel="stylesheet" href="/shared/material-symbols.css" />
    <script src="/shared/htmx.min.js"></script>
    {{inline_i18n_script}}
    <script src="/shared/theme-init.js"></script>
</head>
<body class="admin-ambient-canvas bg-[var(--admin-canvas)] text-[var(--admin-text)] min-h-screen w-full flex flex-col items-center justify-center p-4 sm:p-6 antialiased" style="min-height: 100vh; width: 100%; margin: 0;">
    <div class="max-w-xl w-full my-auto bg-[var(--admin-surface)] rounded-2xl shadow-xl border border-[var(--admin-border)] overflow-hidden" style="margin-top: auto !important; margin-bottom: auto !important;">
        <div class="px-8 py-5 border-b border-[var(--admin-border)] flex justify-between items-center gap-4">
            <div class="min-w-0">
                <h1 class="text-lg font-bold text-[var(--admin-text)] tracking-tight">{{title}}</h1>
                <p class="text-xs text-[var(--admin-text-muted)] mt-0.5">{{subtitle}}</p>
            </div>

            <div class="flex items-center space-x-1.5 shrink-0">
                <span class="material-symbols-outlined text-[var(--admin-text-muted)] text-[16px]">translate</span>
                <edge-select
                    onchange="window.location.href='/admin/switch-locale?locale=' + this.value + '&redirect=/admin/setup'"
                    class="h-8 bg-[var(--admin-surface)] text-[var(--admin-text)] text-xs font-medium rounded-lg px-2.5 border border-[var(--admin-border)] outline-none cursor-pointer"
                >
                    {{setup_locale_options_html}}
                </edge-select>
            </div>
        </div>

        <div class="p-8">
            {{cf_notice_html}}

            <form hx-post="/admin/setup/api/init" hx-target="#setup-feedback" class="space-y-5">
                <div class="space-y-4">
                    <h2 class="text-xs font-bold text-[var(--admin-text)] uppercase tracking-wider border-b border-[var(--admin-border)] pb-2">{{sec_admin}}</h2>

                    <div>
                        <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1.5">{{field_email}} *</label>
                        <input type="email" name="email" value="{{email}}" required class="w-full h-9 bg-[var(--admin-surface)] border border-[var(--admin-border)] text-[var(--admin-text)] rounded-lg px-3 text-xs font-medium focus:border-[var(--admin-accent)] focus:outline-none" />
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1.5">{{field_username}} *</label>
                            <input type="text" name="username" value="{{username}}" required class="w-full h-9 bg-[var(--admin-surface)] border border-[var(--admin-border)] text-[var(--admin-text)] rounded-lg px-3 text-xs font-medium focus:border-[var(--admin-accent)] focus:outline-none" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1.5">{{field_password}} {{password_required_mark}}</label>
                            <input type="password" name="password" {{password_required}} placeholder="••••••••" class="w-full h-9 bg-[var(--admin-surface)] border border-[var(--admin-border)] text-[var(--admin-text)] rounded-lg px-3 text-xs font-medium focus:border-[var(--admin-accent)] focus:outline-none" />
                        </div>
                    </div>
                </div>

                <div class="space-y-4 pt-2">
                    <h2 class="text-xs font-bold text-[var(--admin-text)] uppercase tracking-wider border-b border-[var(--admin-border)] pb-2">{{sec_site}}</h2>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1.5">{{field_tenant}} *</label>
                            <input type="text" name="tenant_name" value="Studio" required class="w-full h-9 bg-[var(--admin-surface)] border border-[var(--admin-border)] text-[var(--admin-text)] rounded-lg px-3 text-xs font-medium focus:border-[var(--admin-accent)] focus:outline-none" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1.5">{{field_site}} *</label>
                            <input type="text" name="site_name" value="My Digital Garden" required class="w-full h-9 bg-[var(--admin-surface)] border border-[var(--admin-border)] text-[var(--admin-text)] rounded-lg px-3 text-xs font-medium focus:border-[var(--admin-accent)] focus:outline-none" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1.5">{{field_domain}} *</label>
                        <input type="text" name="primary_domain" value="{{primary_domain}}" required class="w-full h-9 bg-[var(--admin-surface)] border border-[var(--admin-border)] text-[var(--admin-text)] rounded-lg px-3 text-xs font-mono focus:border-[var(--admin-accent)] focus:outline-none" />
                    </div>
                </div>

                <div id="setup-feedback" class="text-xs font-semibold"></div>

                <div class="pt-2">
                    <button type="submit" class="w-full h-9 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] font-semibold text-[13px] px-4 rounded-lg shadow-sm transition-all flex items-center justify-center space-x-2 cursor-pointer">
                        <span>{{btn_install}}</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="/admin/js/edge-select.js"></script>
</body>
</html>
