<!DOCTYPE html>
<html lang="zh-CN" class="h-full w-full" style="height: 100%; min-height: 100vh; width: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/shared/app.css" />
    <link rel="stylesheet" href="/admin/palettes.css" />
    <link rel="stylesheet" href="/shared/material-symbols.css" />
    <script src="/shared/theme-init.js"></script>
</head>
<body class="admin-ambient-canvas bg-[var(--admin-canvas)] text-[var(--admin-text)] min-h-screen w-full flex flex-col items-center justify-center p-6 antialiased" style="min-height: 100vh; width: 100%; margin: 0;">
    <div class="max-w-md w-full my-auto bg-[var(--admin-surface)] rounded-2xl shadow-xl border border-[var(--admin-border)] p-8 text-center space-y-4" style="margin-top: auto !important; margin-bottom: auto !important;">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[var(--admin-accent-soft)] text-[var(--admin-accent-text)] border border-[var(--admin-accent-border)]">
            <span class="material-symbols-outlined text-[24px]">verified_user</span>
        </div>
        <h1 class="text-lg font-bold text-[var(--admin-text)]">{{title}}</h1>
        <p class="text-xs text-[var(--admin-text-muted)] leading-relaxed">{{desc}}</p>
        <div class="pt-2">
            <a href="/admin" hx-boost="false" class="inline-flex items-center justify-center h-9 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] font-semibold text-[13px] px-6 rounded-lg shadow-sm transition cursor-pointer">{{btn_text}} &rarr;</a>
        </div>
    </div>
</body>
</html>
