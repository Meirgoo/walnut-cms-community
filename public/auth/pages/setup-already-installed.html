<!DOCTYPE html>
<html lang="zh-CN" class="h-full w-full" style="height: 100%; min-height: 100vh; width: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/shared/app.css" />
    <link rel="stylesheet" href="/shared/material-symbols.css" />
    <script src="/shared/theme-init.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen w-full flex flex-col items-center justify-center p-6 antialiased" style="min-height: 100vh; width: 100%; margin: 0;">
    <div class="max-w-md w-full my-auto bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8 text-center space-y-4" style="margin-top: auto !important; margin-bottom: auto !important;">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-900 dark:bg-slate-950 text-emerald-400 shadow-md border border-slate-800">
            <span class="material-symbols-outlined text-[24px]">verified_user</span>
        </div>
        <h1 class="text-xl font-black text-slate-900 dark:text-white">{{title}}</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">{{desc}}</p>
        <div class="pt-2">
            <a href="/admin" hx-boost="false" class="inline-block bg-slate-900 hover:bg-black dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-bold text-xs py-2.5 px-6 rounded-xl shadow-md transition cursor-pointer">{{btn_text}} &rarr;</a>
        </div>
    </div>
</body>
</html>
