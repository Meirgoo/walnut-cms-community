<div class="p-4 bg-[var(--admin-accent-soft)] border border-[var(--admin-accent-border)] rounded-lg space-y-2">
    <label for="setup-password-input" class="block text-xs font-bold text-[var(--admin-accent-text)] uppercase tracking-wider">{{field_setup_password}} *</label>
    <input id="setup-password-input" type="password" name="setup_password" required autocomplete="one-time-code" placeholder="{{setup_password_placeholder}}" class="w-full px-3.5 py-2.5 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg text-sm text-[var(--admin-text)] font-mono focus:outline-none focus:ring-2 focus:ring-[var(--admin-accent)]" />
    <p class="text-[11px] leading-relaxed text-[var(--admin-text-muted)]">{{setup_password_hint}}</p>
</div>
