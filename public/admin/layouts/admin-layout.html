<!DOCTYPE html>
<html lang="{{locale}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="provider" content="{{provider_name}}">
    <meta name="generator" content="{{provider_name}}">
    <title>{{title}} - {{system_title}}</title>
    <link rel="icon" href="{{favicon_url}}" />
    <link rel="stylesheet" href="/shared/app.css?v={{engine_version}}" />
    <link rel="stylesheet" href="/shared/material-symbols.css?v={{engine_version}}" />
    <link rel="preload" href="/shared/material-symbols-subset.woff2" as="font" type="font/woff2" crossorigin />
    <script src="/shared/htmx.min.js?v={{engine_version}}"></script>
    {{inline_i18n_script}}
    <script src="/shared/theme-init.js?v={{engine_version}}"></script>
    <script src="/admin/js/admin-head-init.js?v={{engine_version}}"></script>
</head>
<body hx-sync="this:replace" class="bg-slate-100 dark:bg-slate-950 flex flex-row h-screen w-full overflow-hidden font-sans text-slate-900 dark:text-slate-100 antialiased" style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; width: 100vw !important; height: 100vh !important; overflow: hidden !important;">

{{sidebar}}

<main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 dark:bg-slate-900 min-w-0 relative z-0" style="flex: 1 1 0%; min-width: 0; height: 100%; overflow: hidden;">
    {{children}}

    <div id="global-confirm-modal" class="hidden fixed inset-0 z-[99998] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex items-center space-x-2 text-slate-900 dark:text-white font-bold text-base">
                <span id="confirm-modal-icon" class="material-symbols-outlined text-amber-500 text-[22px]">help</span>
                <span id="confirm-modal-title">{{prompt_confirm}}</span>
            </div>
            <p id="confirm-modal-msg" class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed"></p>
            <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100 dark:border-slate-700">
                <button type="button" id="confirm-modal-cancel" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">{{cancel}}</button>
                <button type="button" id="confirm-modal-ok" class="bg-slate-900 hover:bg-black dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-sm cursor-pointer">{{confirm}}</button>
            </div>
        </div>
    </div>

    <div id="sandboxed-preview-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex flex-col p-3 md:p-6 transition-all duration-200">
        <div class="bg-white dark:bg-slate-900 rounded-2xl w-full h-full max-w-7xl mx-auto shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden">
            <div class="h-12 bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2.5 min-w-0">
                    <span class="material-symbols-outlined text-emerald-600 dark:text-emerald-400 text-[18px]">visibility</span>
                    <span id="sandboxed-preview-title" class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate max-w-xs md:max-w-md"></span>
                    <span id="sandboxed-preview-url" class="hidden sm:inline-block text-[11px] font-mono text-slate-400 dark:text-slate-500 truncate max-w-xs"></span>
                </div>

                <div class="flex items-center space-x-1 bg-slate-200 dark:bg-slate-700 p-0.5 rounded-lg text-slate-600 dark:text-slate-300">
                    <button type="button" onclick="window.setPreviewViewport('100%')" id="preview-vp-desktop" class="px-2.5 py-1 rounded text-[11px] font-semibold bg-white dark:bg-slate-800 shadow-sm flex items-center space-x-1 cursor-pointer" title="{{nav.preview_desktop}}">
                        <span class="material-symbols-outlined text-[14px]">desktop_windows</span>
                        <span class="hidden md:inline">{{nav.preview_desktop}}</span>
                    </button>
                    <button type="button" onclick="window.setPreviewViewport('768px')" id="preview-vp-tablet" class="px-2.5 py-1 rounded text-[11px] font-semibold hover:bg-white/50 dark:hover:bg-slate-800/50 flex items-center space-x-1 cursor-pointer" title="{{nav.preview_tablet}}">
                        <span class="material-symbols-outlined text-[14px]">tablet_mac</span>
                        <span class="hidden md:inline">{{nav.preview_tablet}}</span>
                    </button>
                    <button type="button" onclick="window.setPreviewViewport('375px')" id="preview-vp-mobile" class="px-2.5 py-1 rounded text-[11px] font-semibold hover:bg-white/50 dark:hover:bg-slate-800/50 flex items-center space-x-1 cursor-pointer" title="{{nav.preview_mobile}}">
                        <span class="material-symbols-outlined text-[14px]">smartphone</span>
                        <span class="hidden md:inline">{{nav.preview_mobile}}</span>
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <a id="sandboxed-preview-external-link" href="#" target="_blank" rel="noopener noreferrer" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center justify-center cursor-pointer" title="{{nav.open_in_new_tab}}">
                        <span class="material-symbols-outlined text-[18px]">open_in_new</span>
                    </a>
                    <button type="button" onclick="window.closeSandboxedPreview()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center justify-center cursor-pointer" title="{{nav.close_preview}}">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
            </div>

            <div class="flex-1 bg-slate-200/50 dark:bg-slate-950 flex justify-center items-center overflow-hidden p-2">
                <iframe
                    id="sandboxed-preview-iframe"
                    sandbox="allow-scripts allow-forms allow-same-origin"
                    class="h-full w-full bg-white transition-all duration-300 rounded-lg shadow-sm border border-slate-300/80 dark:border-slate-800"
                    src="about:blank"
                ></iframe>
            </div>
        </div>
    </div>
</main>

<script src="/admin/js/admin.js?v={{engine_version}}"></script>
<script src="/admin/js/og-card-generator.js?v={{engine_version}}"></script>
<script src="/shared/quick-actions.js?v={{engine_version}}" defer></script>
{{slot_commercial_scripts}}

<div id="global-toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[99999] flex flex-col items-center space-y-2 pointer-events-none"></div>
</body>
</html>
