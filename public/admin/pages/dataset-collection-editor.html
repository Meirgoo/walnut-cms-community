<div class="p-6 lg:p-8 space-y-5 overflow-y-auto thin-scrollbar h-full w-full">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[var(--admin-border)] pb-4 shrink-0">
        <div class="flex items-center space-x-3">
            <a href="/admin/datasets" class="p-1.5 rounded-lg text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] hover:bg-[var(--admin-surface-hover)] transition-colors duration-75 ease-out">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </a>
            <div>
                <div class="flex items-center space-x-2">
                    <a href="/admin/datasets" class="text-sm font-medium text-[var(--admin-text-muted)] hover:text-[var(--admin-text)]">{{breadcrumb_root}}</a>
                    <span class="text-sm text-[var(--admin-text-muted)]">/</span>
                    <h1 class="text-lg font-bold text-[var(--admin-text)] tracking-tight">{{collection_title}}</h1>
                    <span class="list-pill list-pill-locale">{{schema_label}}</span>
                </div>
                <p class="text-xs text-[var(--admin-text-muted)] mt-0.5">{{collection_subtitle}}</p>
            </div>
        </div>

        <div class="flex items-center flex-wrap gap-2 shrink-0">
            <button
                type="button"
                id="btn-copy-ai-clean-context"
                class="h-8 px-3 rounded-lg bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-accent-text)] text-xs font-medium border border-[var(--admin-border)] transition flex items-center space-x-1.5 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[15px]">auto_awesome</span>
                <span>{{btn_copy_ai_clean_context}}</span>
            </button>
            <button
                type="button"
                id="btn-open-collection-import"
                class="h-8 px-3 rounded-lg bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text)] text-xs font-medium border border-[var(--admin-border)] transition flex items-center space-x-1.5 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[15px]">upload_file</span>
                <span>{{btn_import_json}}</span>
            </button>
            <button
                type="button"
                id="btn-open-collection-export"
                class="h-8 px-3 rounded-lg bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] text-xs font-medium border border-[var(--admin-border)] transition flex items-center space-x-1.5 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[15px]">file_download</span>
                <span>{{btn_export_json}}</span>
            </button>
            <button
                type="button"
                id="btn-add-collection-row"
                class="h-8 px-3 rounded-lg bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text)] text-xs font-medium border border-[var(--admin-border)] transition flex items-center space-x-1.5 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[15px]">add</span>
                <span>{{btn_add_row}}</span>
            </button>
            <button
                type="button"
                id="btn-save-collection"
                class="h-8 px-3.5 rounded-lg bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] text-[13px] font-semibold shadow-sm transition flex items-center space-x-1.5 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">save</span>
                <span>{{btn_save_collection}}</span>
            </button>
        </div>
    </div>

    <div class="bg-[var(--admin-surface)] rounded-2xl border border-[var(--admin-border)] shadow-sm overflow-hidden">
        <div class="overflow-x-auto thin-scrollbar">
            <table class="w-full text-left border-collapse" id="collection-editor-table">
                <thead>
                    <tr id="collection-table-head" class="bg-[var(--admin-chrome)]/60 border-b border-[var(--admin-border)] text-[11px] font-semibold text-[var(--admin-text-muted)] uppercase tracking-wider">
                    </tr>
                </thead>
                <tbody id="collection-table-body" class="divide-y divide-[var(--admin-border)] text-xs text-[var(--admin-text)]">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="collection-import-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) window.closeCollectionContractModal && window.closeCollectionContractModal()">
    <div class="bg-[var(--admin-surface)] rounded-2xl max-w-2xl w-full shadow-2xl border border-[var(--admin-border)] overflow-hidden flex flex-col max-h-[90vh]">
        <div class="px-5 py-3.5 border-b border-[var(--admin-border)] bg-[var(--admin-chrome)] flex justify-between items-center shrink-0">
            <div class="flex items-center space-x-2">
                <span class="material-symbols-outlined text-[var(--admin-accent-text)] text-[18px]">dataset</span>
                <h3 class="text-sm font-bold text-[var(--admin-text)]">{{modal_collection_import_title}}</h3>
            </div>
            <button type="button" id="btn-close-collection-import" class="text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] p-1 rounded-lg hover:bg-[var(--admin-surface-hover)] cursor-pointer">
                <span class="material-symbols-outlined text-[18px]">close</span>
            </button>
        </div>

        <div class="flex border-b border-[var(--admin-border)] bg-[var(--admin-chrome)] px-5 text-xs font-semibold shrink-0">
            <button type="button" id="btn-col-modal-tab-ai" onclick="window.switchCollectionModalTab && window.switchCollectionModalTab('ai')" class="px-4 py-2.5 border-b-2 border-[var(--admin-accent)] text-[var(--admin-text)] cursor-pointer transition flex items-center space-x-1.5">
                <span class="material-symbols-outlined text-[15px]">auto_awesome</span>
                <span>{{datasets.modal_tab_ai_clean}}</span>
            </button>
            <button type="button" id="btn-col-modal-tab-export" onclick="window.switchCollectionModalTab && window.switchCollectionModalTab('export')" class="px-4 py-2.5 border-b-2 border-transparent text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] cursor-pointer transition flex items-center space-x-1.5">
                <span class="material-symbols-outlined text-[15px]">file_download</span>
                <span>{{btn_export_json}}</span>
            </button>
            <button type="button" id="btn-col-modal-tab-import" onclick="window.switchCollectionModalTab && window.switchCollectionModalTab('import')" class="px-4 py-2.5 border-b-2 border-transparent text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] cursor-pointer transition flex items-center space-x-1.5">
                <span class="material-symbols-outlined text-[15px]">upload_file</span>
                <span>{{btn_import_json}}</span>
            </button>
        </div>

        <div id="col-modal-pane-ai" class="flex-1 min-h-0 flex flex-col overflow-hidden">
            <div class="p-5 flex-1 min-h-0 flex flex-col">
                <textarea id="collection-ai-clean-preview" readonly class="w-full h-72 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-xl p-3 text-xs font-mono text-[var(--admin-text)] resize-none outline-none leading-relaxed thin-scrollbar"></textarea>
            </div>
            <div class="px-5 py-3 border-t border-[var(--admin-border)] bg-[var(--admin-chrome)] flex justify-end space-x-2 shrink-0">
                <button type="button" onclick="window.closeCollectionContractModal && window.closeCollectionContractModal()" class="h-8 px-3 rounded-lg text-xs font-medium text-[var(--admin-text-muted)] hover:bg-[var(--admin-surface-hover)] cursor-pointer">{{common.close}}</button>
                <button type="button" id="btn-col-ai-download" class="h-8 px-3 rounded-lg bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] border border-[var(--admin-border)] text-xs font-semibold text-[var(--admin-text)] flex items-center space-x-1.5 cursor-pointer">
                    <span class="material-symbols-outlined text-[15px]">download</span>
                    <span>{{datasets.btn_download_md}}</span>
                </button>
                <button type="button" id="btn-col-ai-copy" class="h-8 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] px-4 rounded-lg text-xs font-semibold shadow-sm flex items-center space-x-1.5 cursor-pointer">
                    <span class="material-symbols-outlined text-[15px]">content_copy</span>
                    <span>{{common.copy}}</span>
                </button>
            </div>
        </div>

        <div id="col-modal-pane-export" class="hidden flex-1 min-h-0 flex flex-col overflow-hidden">
            <div class="p-5 flex-1 min-h-0 flex flex-col">
                <textarea id="collection-export-json-preview" readonly class="w-full h-72 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-xl p-3 text-xs font-mono text-[var(--admin-text)] resize-none outline-none leading-relaxed thin-scrollbar"></textarea>
            </div>
            <div class="px-5 py-3 border-t border-[var(--admin-border)] bg-[var(--admin-chrome)] flex justify-end space-x-2 shrink-0">
                <button type="button" onclick="window.closeCollectionContractModal && window.closeCollectionContractModal()" class="h-8 px-3 rounded-lg text-xs font-medium text-[var(--admin-text-muted)] hover:bg-[var(--admin-surface-hover)] cursor-pointer">{{common.close}}</button>
                <button type="button" id="btn-col-export-download" class="h-8 px-3 rounded-lg bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] border border-[var(--admin-border)] text-xs font-semibold text-[var(--admin-text)] flex items-center space-x-1.5 cursor-pointer">
                    <span class="material-symbols-outlined text-[15px]">download</span>
                    <span>{{datasets.btn_download_json}}</span>
                </button>
                <button type="button" id="btn-col-export-copy" class="h-8 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] px-4 rounded-lg text-xs font-semibold shadow-sm flex items-center space-x-1.5 cursor-pointer">
                    <span class="material-symbols-outlined text-[15px]">content_copy</span>
                    <span>{{common.copy}}</span>
                </button>
            </div>
        </div>

        <div id="col-modal-pane-import" class="hidden flex-1 min-h-0 flex flex-col overflow-hidden">
            <div class="p-5 space-y-3 overflow-y-auto flex-1">
                <label class="block text-xs font-semibold text-[var(--admin-text)]">{{import_paste_label}}</label>
                <input type="file" id="collection-import-file" accept=".json,application/json" class="w-full text-xs text-[var(--admin-text-muted)] file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border file:border-[var(--admin-border)] file:text-xs file:font-semibold file:bg-[var(--admin-chrome)] file:text-[var(--admin-text)] hover:file:bg-[var(--admin-surface-hover)] cursor-pointer" />
                <textarea id="collection-import-textarea" rows="7" placeholder="{{import_paste_placeholder}}" class="w-full bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-xl p-3 text-xs font-mono text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)] thin-scrollbar"></textarea>
                <label class="flex items-center space-x-2 text-xs text-[var(--admin-text)] cursor-pointer">
                    <input type="checkbox" id="collection-import-skip-conflicts" checked class="w-4 h-4 rounded border-[var(--admin-border)] accent-[var(--admin-accent)]" />
                    <span>{{import_skip_conflicts}}</span>
                </label>
                <div id="collection-import-feedback" class="text-xs space-y-1"></div>
            </div>
            <div class="px-5 py-3 border-t border-[var(--admin-border)] bg-[var(--admin-chrome)] flex justify-end space-x-2 shrink-0">
                <button type="button" id="btn-cancel-collection-import" class="h-8 px-3 rounded-lg text-xs font-medium text-[var(--admin-text-muted)] hover:bg-[var(--admin-surface-hover)] cursor-pointer">{{common.cancel}}</button>
                <button type="button" id="btn-confirm-collection-import" disabled class="h-8 bg-[var(--admin-border)] text-[var(--admin-text-muted)] px-4 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 cursor-not-allowed opacity-70">
                    <span class="material-symbols-outlined text-[16px]">check</span>
                    <span>{{btn_confirm_import}}</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script type="application/json" id="collection-schema-data">{{schema_fields_json}}</script>
<script type="application/json" id="collection-rows-data">{{rows_json}}</script>
<input type="hidden" id="collection-id" value="{{collection_id}}" />
<input type="hidden" id="collection-slug" value="{{collection_slug}}" />
<input type="hidden" id="collection-schema-slug" value="{{schema_slug}}" />
<script src="/admin/js/dataset-collection-editor.js" defer></script>
