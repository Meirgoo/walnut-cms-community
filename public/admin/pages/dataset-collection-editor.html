<div class="p-6 lg:p-8 space-y-6 overflow-y-auto thin-scrollbar h-full w-full">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200/80 dark:border-slate-800 pb-4 shrink-0">
        <div class="flex items-center space-x-3">
            <a href="/admin/datasets" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors duration-75 ease-out">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </a>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-black text-slate-900 dark:text-white tracking-tight">{{collection_title}}</h1>
                    <span class="px-2 py-0.5 rounded-md text-xs font-mono font-bold bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800">{{schema_slug}}</span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{collection_subtitle}}</p>
            </div>
        </div>

        <div class="flex items-center space-x-2.5 shrink-0">
            <button
                type="button"
                id="btn-add-collection-row"
                class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3.5 py-2 rounded-xl text-xs font-bold border border-slate-200 dark:border-slate-700 shadow-xs transition-colors duration-75 ease-out flex items-center space-x-1.5 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">add</span>
                <span>{{btn_add_row}}</span>
            </button>
            <button
                type="button"
                id="btn-save-collection"
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm transition-colors duration-75 ease-out flex items-center space-x-1.5 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">save</span>
                <span>{{btn_save_collection}}</span>
            </button>
        </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm overflow-hidden">
        <div class="overflow-x-auto thin-scrollbar">
            <table class="w-full text-left border-collapse" id="collection-editor-table">
                <thead>
                    <tr id="collection-table-head" class="bg-slate-50 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-700 text-[11px] font-bold text-slate-400 uppercase tracking-wider font-mono">
                    </tr>
                </thead>
                <tbody id="collection-table-body" class="divide-y divide-slate-100 dark:divide-slate-700/60 text-xs text-slate-700 dark:text-slate-300">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="application/json" id="collection-schema-data">{{schema_fields_json}}</script>
<script type="application/json" id="collection-rows-data">{{rows_json}}</script>
<input type="hidden" id="collection-schema-slug" value="{{schema_slug}}" />
<script src="/admin/js/dataset-collection-editor.js" defer></script>
