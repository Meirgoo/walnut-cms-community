<div class="w-full h-full overflow-y-auto no-scrollbar [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
    <div class="p-8 space-y-6 max-w-4xl mx-auto w-full">
    <div class="border-b border-stone-200/80 dark:border-stone-800 pb-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="/admin/datasets" class="p-2 rounded-xl text-stone-400 hover:text-stone-700 dark:hover:text-white hover:bg-stone-100 dark:hover:bg-stone-800 transition">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </a>
            <div>
                <h1 class="text-xl font-black text-stone-900 dark:text-white tracking-tight">{{editor_title}}</h1>
                <p class="text-xs text-stone-500 dark:text-stone-400 mt-0.5">{{editor_desc}}</p>
            </div>
        </div>

        {{version_badge_html}}
    </div>

    <form id="dataset-editor-form" onsubmit="window.handleDatasetFormSubmit && window.handleDatasetFormSubmit(event)" class="space-y-6">
        <input type="hidden" name="dataset_id" value="{{dataset_id}}" />
        <input type="hidden" name="is_edit" value="{{is_edit}}" />

        <div class="bg-[var(--admin-surface)] p-6 rounded-2xl border border-[var(--admin-border)] shadow-sm space-y-4">
            <div class="flex items-center space-x-2 border-b border-stone-100 dark:border-stone-700 pb-3">
                <span class="material-symbols-outlined text-amber-500 text-[20px]">contract</span>
                <h2 class="text-sm font-bold text-stone-900 dark:text-white uppercase tracking-wider">{{sec_contract}}</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_title}}</label>
                    <input type="text" name="title" id="dataset-title-input" value="{{dataset_title}}" required placeholder="{{placeholder_title}}" class="w-full bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 rounded-xl px-3 py-2 text-xs font-semibold text-stone-800 dark:text-stone-100 focus:border-stone-900 dark:focus:border-amber-500 outline-none" />
                </div>

                <edge-select class="relative block" id="dropdown-box-dataset-schema">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-stone-700 dark:text-stone-300">{{field_schema}}</label>
                        <button type="button" onclick="window.openNewSchemaModal && window.openNewSchemaModal()" class="text-[11px] text-[var(--admin-accent-text)] hover:underline font-bold flex items-center space-x-0.5 cursor-pointer">
                            <span class="material-symbols-outlined text-[13px]">add_circle</span>
                            <span>{{btn_new_schema}}</span>
                        </button>
                    </div>
                    <input type="hidden" name="schema_slug" id="dataset-schema-input" value="{{current_schema_slug}}" />
                    <button
                        type="button"
                        id="dataset-schema-btn"
                        onclick="const m=document.getElementById('dropdown-menu-dataset-schema');if(m)m.classList.toggle('hidden');"
                        class="w-full bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 rounded-xl px-3 py-2 text-xs font-semibold text-stone-800 dark:text-stone-200 outline-none flex items-center justify-between text-left cursor-pointer {{schema_selector_disabled}}"
                    >
                        <span id="dataset-schema-label" class="truncate">{{current_schema_label}}</span>
                        <span class="material-symbols-outlined text-[16px] text-stone-400 shrink-0 ml-1">expand_more</span>
                    </button>
                    <div
                        id="dropdown-menu-dataset-schema"
                        class="hidden absolute left-0 right-0 top-full mt-1 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-xl shadow-2xl py-1 z-30 text-xs divide-y divide-stone-100 dark:divide-stone-700 max-h-56 overflow-y-auto"
                    >
                        {{schema_dropdown_options_html}}
                    </div>
                </edge-select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_summary}}</label>
                    <input type="text" name="summary" value="{{dataset_summary}}" placeholder="{{placeholder_summary}}" class="w-full bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 rounded-xl px-3 py-2 text-xs text-stone-800 dark:text-stone-100 focus:border-stone-900 dark:focus:border-amber-500 outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_sort_order}}</label>
                    <input type="number" name="sort_order" value="{{dataset_sort_order}}" step="1" class="w-full bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 rounded-xl px-3 py-2 text-xs font-mono text-stone-800 dark:text-stone-100 focus:border-stone-900 dark:focus:border-amber-500 outline-none" />
                </div>
            </div>
        </div>

        <div class="bg-[var(--admin-surface)] p-6 rounded-2xl border border-[var(--admin-border)] shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b border-stone-100 dark:border-stone-700 pb-3">
                <div class="flex items-center space-x-2">
                    <span class="material-symbols-outlined text-purple-600 dark:text-purple-400 text-[20px]">dynamic_form</span>
                    <h2 class="text-sm font-bold text-stone-900 dark:text-white uppercase tracking-wider">{{sec_fields}}</h2>
                </div>
            </div>

            <div id="dynamic-schema-fields-container" class="space-y-4">
                {{dynamic_fields_html}}
            </div>
        </div>

        <div class="bg-[var(--admin-surface)] p-6 rounded-2xl border border-[var(--admin-border)] shadow-sm space-y-4">
            <div class="flex items-center space-x-2 border-b border-stone-100 dark:border-stone-700 pb-3">
                <span class="material-symbols-outlined text-blue-600 dark:text-blue-400 text-[20px]">commit</span>
                <h2 class="text-sm font-bold text-stone-900 dark:text-white uppercase tracking-wider">{{sec_vcs}}</h2>
            </div>
            <div>
                <input type="text" name="commit_message" id="dataset-commit-message-input" placeholder="{{placeholder_commit}}" class="w-full bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 rounded-xl px-3 py-2 text-xs text-stone-800 dark:text-stone-100 focus:border-stone-900 dark:focus:border-amber-500 outline-none" />
            </div>

            <div class="pt-3 border-t border-stone-100 dark:border-stone-700 space-y-2 {{versions_section_class}}">
                <div class="flex items-center justify-between">
                    <label class="font-bold text-stone-700 dark:text-stone-300 text-xs">{{editor.versions_title}}</label>
                    <span id="vcs-versions-count" class="text-[11px] font-mono text-stone-500 font-bold">{{versions_count}}</span>
                </div>
                <div id="vcs-versions-list" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                    {{past_versions_html}}
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center pt-2">
            <div class="flex items-center space-x-3">
                <button
                    type="button"
                    onclick="window.confirmSoftDeleteDataset && window.confirmSoftDeleteDataset()"
                    class="px-4 py-2 rounded-xl text-xs font-bold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 transition flex items-center space-x-1.5 cursor-pointer {{soft_delete_btn_class}}"
                >
                    <span class="material-symbols-outlined text-[15px]">delete</span>
                    <span>{{common.btn_move_to_trash}}</span>
                </button>
                <div id="dataset-editor-feedback" class="text-xs font-bold"></div>
            </div>
            <div class="flex space-x-2">
                <a href="/admin/datasets" class="px-5 py-2.5 rounded-xl text-xs font-bold text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-800 transition">{{cancel}}</a>
                <button type="submit" class="bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] font-black text-xs px-8 py-2.5 rounded-xl shadow-lg transition-colors duration-75 ease-out cursor-pointer flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[16px]">save</span>
                    <span>{{btn_save}}</span>
                </button>
            </div>
        </div>
    </form>
    </div>
</div>

{{modal_new_schema}}
<script type="application/json" id="vcs-versions-data">{{vcs_versions_json}}</script>
<script type="application/json" id="dataset-schemas-data">{{schemas_json}}</script>
<script src="/admin/js/datasets-schemas.js?v={{engine_version}}" defer></script>
