<div class="w-full h-full overflow-y-auto no-scrollbar [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
    <div class="p-8 space-y-6 max-w-4xl mx-auto w-full">
    <div class="border-b border-slate-200/80 dark:border-slate-800 pb-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="/admin/themes" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </a>
            <div>
                <h1 class="text-xl font-black text-slate-900 dark:text-white tracking-tight">{{new_title}}</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{subtitle}}</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <span class="text-xs font-mono bg-purple-50 dark:bg-purple-950 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800 px-2.5 py-1 rounded-lg font-bold">
                {{badge}}
            </span>
        </div>
    </div>

    <form id="new-schema-page-form" onsubmit="window.handleNewSchemaPageSubmit && window.handleNewSchemaPageSubmit(event)" class="space-y-6">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-4">
            <div class="flex items-center space-x-2 border-b border-slate-100 dark:border-slate-700 pb-3">
                <span class="material-symbols-outlined text-purple-600 dark:text-purple-400 text-[20px]">data_object</span>
                <h2 class="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider">{{sec_meta}}</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{{field_title}}</label>
                    <input type="text" name="title" id="schema-title-input" required placeholder="{{placeholder_title}}" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold text-slate-800 dark:text-slate-100 focus:border-slate-900 dark:focus:border-emerald-500 outline-none" />
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{{field_slug}}</label>
                    <input type="text" name="slug" id="schema-slug-input" required placeholder="{{placeholder_slug}}" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-slate-800 dark:text-slate-100 focus:border-slate-900 dark:focus:border-emerald-500 outline-none" />
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{{field_summary}}</label>
                <input type="text" name="summary" placeholder="{{placeholder_summary}}" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-slate-100 focus:border-slate-900 dark:focus:border-emerald-500 outline-none" />
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
                <div class="flex items-center space-x-2">
                    <span class="material-symbols-outlined text-emerald-500 text-[20px]">list_alt</span>
                    <h2 class="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider">{{sec_fields}}</h2>
                </div>
                <button
                    type="button"
                    onclick="window.addPageSchemaFieldRow && window.addPageSchemaFieldRow()"
                    class="bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 hover:bg-emerald-100 dark:hover:bg-emerald-900 border border-emerald-200 dark:border-emerald-800 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1 transition cursor-pointer"
                >
                    <span class="material-symbols-outlined text-[15px]">add_circle</span>
                    <span>{{btn_add_field}}</span>
                </button>
            </div>

            <div id="page-schema-fields-list" class="space-y-3">
                <div class="p-8 text-center text-slate-400 text-xs italic border border-dashed border-slate-200 dark:border-slate-700 rounded-2xl" id="page-schema-fields-empty">
                    {{empty_fields_tip}}
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center pt-2">
            <div id="new-schema-page-feedback" class="text-xs font-bold"></div>
            <div class="flex space-x-2">
                <a href="/admin/themes" class="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">{{cancel}}</a>
                <button type="submit" class="bg-slate-900 hover:bg-black dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-black text-xs px-8 py-2.5 rounded-xl shadow-lg transition-colors duration-75 ease-out cursor-pointer flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[16px]">save</span>
                    <span>{{btn_save}}</span>
                </button>
            </div>
        </div>
    </form>
    </div>
</div>
<script src="/admin/js/datasets-schemas.js?v={{engine_version}}" defer></script>
