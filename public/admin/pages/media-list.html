<div class="p-6 md:p-8 overflow-y-auto h-full flex flex-col min-h-0 space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 shrink-0">
        <div class="flex items-center space-x-3">
            <h1 class="text-xl font-black text-[var(--admin-text)] tracking-tight">{{media_title}}</h1>
            <span id="media-filter-count" class="text-xs font-mono font-medium bg-[var(--admin-surface)] text-[var(--admin-text-muted)] px-2.5 py-0.5 rounded-full border border-[var(--admin-border)]">
                {{total_records_text}}
            </span>
        </div>

        <div class="flex items-center space-x-2">
            <label class="h-8 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] px-3 rounded-lg text-[13px] font-semibold shadow-sm transition cursor-pointer flex items-center space-x-1.5">
                <span class="material-symbols-outlined text-[16px]">upload_file</span>
                <span>{{btn_upload}}</span>
                <input id="media-upload-input" type="file" multiple class="hidden" />
            </label>
        </div>
    </div>

    <div class="flex items-center justify-between gap-3 shrink-0">
        <div class="w-full sm:w-72 flex items-center space-x-2 bg-[var(--admin-surface)] px-2.5 h-8 rounded-lg border border-[var(--admin-border)] focus-within:border-[var(--admin-accent)] transition">
            <span class="material-symbols-outlined text-[var(--admin-text-muted)] text-[16px]">search</span>
            <input
                type="text"
                id="media-search-input"
                placeholder="{{search_placeholder}}"
                oninput="window.filterCardItems('media-grid-container', '.media-card-item', this.value, 'media-filter-count', 'media-empty-state')"
                class="bg-transparent text-xs text-[var(--admin-text)] placeholder-[var(--admin-text-muted)] outline-none w-full font-medium"
            />
        </div>
    </div>

    <div id="batch-toolbar" class="hidden bg-[var(--admin-accent-soft)] border border-[var(--admin-accent-border)] px-4 py-2 rounded-xl flex flex-wrap items-center justify-between gap-2 text-xs shrink-0 transition-all">
        <div class="flex items-center space-x-3">
            <span id="selected-count-badge" class="font-semibold font-mono text-[var(--admin-accent-text)]">{{selected_count_zero}}</span>
            <button type="button" onclick="selectAllMedia()" class="text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] underline cursor-pointer">{{btn_select_all}}</button>
            <button type="button" onclick="deselectAllMedia()" class="text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] underline cursor-pointer">{{btn_deselect_all}}</button>
        </div>

        <div class="flex items-center space-x-2">
            <button type="button" onclick="openBatchRenameModal()" class="h-7 px-2.5 rounded-md bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text)] border border-[var(--admin-border)] font-medium flex items-center space-x-1 cursor-pointer transition {{btn_batch_rename_class}}">
                <span class="material-symbols-outlined text-[14px]">edit_note</span>
                <span>{{btn_batch_rename}}</span>
            </button>
            <button type="button" onclick="batchCopyUrls()" class="h-7 px-2.5 rounded-md bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text)] border border-[var(--admin-border)] font-medium flex items-center space-x-1 cursor-pointer transition">
                <span class="material-symbols-outlined text-[14px]">content_copy</span>
                <span>{{btn_batch_copy_urls}}</span>
            </button>
            <button type="button" onclick="batchCopyMarkdown()" class="h-7 px-2.5 rounded-md bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text)] border border-[var(--admin-border)] font-medium flex items-center space-x-1 cursor-pointer transition">
                <span class="material-symbols-outlined text-[14px]">code</span>
                <span>{{btn_batch_copy_md}}</span>
            </button>
            <button type="button" onclick="window.batchDeleteMediaSelected()" class="h-7 px-2.5 rounded-md bg-red-600 hover:bg-red-700 text-white font-medium flex items-center space-x-1 cursor-pointer transition">
                <span class="material-symbols-outlined text-[14px]">delete</span>
                <span>{{btn_batch_delete}}</span>
            </button>
        </div>
    </div>

    <div id="upload-status" class="hidden p-4 bg-blue-50 dark:bg-blue-950 border border-blue-200 dark:border-blue-800 rounded-xl text-xs font-bold text-blue-800 dark:text-blue-300"></div>

    <div class="flex-1 overflow-y-auto min-h-0">
        {{media_grid_content}}

        <div id="media-empty-state" class="hidden p-12 text-center text-stone-400 text-xs">
            {{no_matching_records}}
        </div>
    </div>
</div>

<div id="media-detail-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-6">
    <div class="bg-[var(--admin-surface)] rounded-2xl max-w-5xl w-full h-[80vh] flex overflow-hidden shadow-2xl border border-stone-700">
        <div class="flex-1 bg-stone-950 flex items-center justify-center p-6 relative overflow-hidden">
            <img id="modal-img-preview" src="" alt="" class="max-h-full max-w-full object-contain rounded-lg shadow-lg" />
            <div id="modal-doc-preview" class="hidden flex flex-col items-center justify-center text-stone-400 space-y-2">
                <span class="material-symbols-outlined text-[64px]">draft</span>
                <span class="text-sm font-bold">{{modal_doc_preview}}</span>
            </div>
        </div>

        <div class="w-80 border-l border-[var(--admin-border)] p-5 pb-6 flex flex-col justify-between overflow-y-auto thin-scrollbar bg-[var(--admin-canvas)] text-xs">
            <div class="space-y-4">
                <div class="flex justify-between items-start">
                    <h3 id="modal-file-name" class="font-bold text-stone-900 dark:text-white text-sm break-all"></h3>
                    <button type="button" onclick="closeMediaModal()" class="text-stone-400 hover:text-stone-700 dark:hover:text-white cursor-pointer ml-2">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>

                <div class="space-y-2.5 pt-2 border-t border-[var(--admin-border)]">
                    <div>
                        <label class="block font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_meta_title}}</label>
                        <input type="text" id="modal-meta-title" placeholder="{{placeholder_meta_title}}" class="w-full bg-white dark:bg-stone-950 border border-[var(--admin-border)] rounded-lg px-2.5 py-1.5 text-stone-800 dark:text-stone-200 text-xs outline-none focus:border-amber-500" />
                    </div>
                    <div>
                        <label class="block font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_meta_alt}}</label>
                        <input type="text" id="modal-meta-alt" placeholder="{{placeholder_meta_alt}}" class="w-full bg-white dark:bg-stone-950 border border-[var(--admin-border)] rounded-lg px-2.5 py-1.5 text-stone-800 dark:text-stone-200 text-xs outline-none focus:border-amber-500" />
                    </div>
                    <div>
                        <label class="block font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_file_name}}</label>
                        <input type="text" id="modal-edit-filename" class="w-full bg-white dark:bg-stone-950 border border-[var(--admin-border)] rounded-lg px-2.5 py-1.5 text-stone-800 dark:text-stone-200 font-mono text-[11px] outline-none focus:border-amber-500" />
                    </div>
                    <div>
                        <label class="block font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_folder}}</label>
                        <input type="text" id="modal-edit-folder" list="media-folders-datalist" placeholder="{{placeholder_folder}}" class="w-full bg-white dark:bg-stone-950 border border-[var(--admin-border)] rounded-lg px-2.5 py-1.5 text-stone-800 dark:text-stone-200 text-xs outline-none focus:border-amber-500" />
                        <datalist id="media-folders-datalist">
                            {{folder_datalist_options}}
                        </datalist>
                    </div>
                    <label class="flex items-center space-x-2 pt-1 cursor-pointer select-none">
                        <input type="checkbox" id="modal-edit-is-public" class="w-4 h-4 rounded border-stone-300 dark:border-stone-600 text-amber-600 focus:ring-0 cursor-pointer accent-amber-600" />
                        <span class="font-bold text-stone-700 dark:text-stone-300">{{field_is_public}}</span>
                    </label>
                </div>

                <div class="space-y-1.5 font-mono text-[11px] text-stone-500 dark:text-stone-400 pt-2 border-t border-[var(--admin-border)]">
                    <div>{{field_file_size}}<span id="modal-file-size" class="text-stone-800 dark:text-stone-200 font-bold"></span></div>
                    <div>MIME: <span id="modal-mime-type" class="text-stone-800 dark:text-stone-200 font-bold"></span></div>
                    <div>{{field_upload_time}}<span id="modal-created-at" class="text-stone-800 dark:text-stone-200 font-bold"></span></div>
                    <div class="break-all">{{field_storage_path}}<span id="modal-r2-key" class="text-stone-800 dark:text-stone-200"></span></div>
                </div>

                <div class="space-y-2.5 pt-2">
                    <div>
                        <label class="block font-bold text-[var(--admin-text)] mb-1">{{field_direct_url}}</label>
                        <div class="flex space-x-1.5">
                            <input type="text" id="modal-url-input" readonly class="flex-1 h-7 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-2 text-[var(--admin-text-muted)] font-mono text-[11px]" />
                            <button type="button" onclick="copyModalInput('modal-url-input')" class="h-7 px-2 bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] border border-[var(--admin-border)] rounded-lg font-medium text-[11px] inline-flex items-center space-x-1 cursor-pointer transition" title="{{copy}}">
                                <span class="material-symbols-outlined text-[13px]">content_copy</span>
                                <span>{{copy}}</span>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block font-bold text-[var(--admin-text)] mb-1">{{field_md_syntax}}</label>
                        <div class="flex space-x-1.5">
                            <input type="text" id="modal-md-input" readonly class="flex-1 h-7 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-2 text-[var(--admin-text-muted)] font-mono text-[11px]" />
                            <button type="button" onclick="copyModalInput('modal-md-input')" class="h-7 px-2 bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] border border-[var(--admin-border)] rounded-lg font-medium text-[11px] inline-flex items-center space-x-1 cursor-pointer transition" title="{{copy}}">
                                <span class="material-symbols-outlined text-[13px]">content_copy</span>
                                <span>{{copy}}</span>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block font-bold text-[var(--admin-text)] mb-1">{{field_html_syntax}}</label>
                        <div class="flex space-x-1.5">
                            <input type="text" id="modal-html-input" readonly class="flex-1 h-7 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-2 text-[var(--admin-text-muted)] font-mono text-[11px]" />
                            <button type="button" onclick="copyModalInput('modal-html-input')" class="h-7 px-2 bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] border border-[var(--admin-border)] rounded-lg font-medium text-[11px] inline-flex items-center space-x-1 cursor-pointer transition" title="{{copy}}">
                                <span class="material-symbols-outlined text-[13px]">content_copy</span>
                                <span>{{copy}}</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-4 pb-2 mt-4 border-t border-[var(--admin-border)] space-y-2 shrink-0">
                <button type="button" id="modal-save-btn" class="w-full text-center bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] font-bold py-2 rounded-lg transition-colors duration-75 ease-out cursor-pointer flex items-center justify-center space-x-1.5">
                    <span class="material-symbols-outlined text-[16px]">save</span>
                    <span>{{btn_save_meta}}</span>
                </button>
                <a id="modal-direct-link" href="" target="_blank" class="block w-full text-center bg-stone-200 dark:bg-stone-800 hover:bg-stone-300 dark:hover:bg-stone-700 text-stone-800 dark:text-stone-200 font-bold py-1.5 rounded-lg transition-colors duration-75 ease-out">
                    {{open_in_new_tab}}
                </a>
                <button type="button" id="modal-delete-btn" class="block w-full text-center bg-red-50 dark:bg-red-950 hover:bg-red-100 dark:hover:bg-red-900 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 font-bold py-1.5 rounded-lg transition-colors duration-75 ease-out cursor-pointer">
                    {{btn_delete_file}}
                </button>
            </div>
        </div>
    </div>
</div>

{{batch_rename_modal}}
<script src="/admin/js/admin-tables.js" defer></script>
<script src="/admin/js/media-admin.js" defer></script>
