<form
    id="article-edit-form"
    class="flex-1 flex flex-col h-full w-full min-h-0 bg-[var(--admin-canvas)] overflow-hidden"
    onsubmit="event.preventDefault(); window.submitWithStatus();"
>
    <input type="hidden" id="form-node-id" name="id" value="{{node_id}}" />
    <input type="hidden" name="site_id" value="{{site_id}}" />
    <input type="hidden" name="is_edit" value="{{is_edit}}" />
    <input type="hidden" id="form-type-input" name="type" value="{{initial_type}}" />
    <input type="hidden" id="form-locale-input" name="locale" value="{{current_locale}}" />
    <input type="hidden" id="form-maturity-input" name="maturity" value="{{current_maturity}}" />
    <input type="hidden" id="form-progress-input" name="progress" value="{{current_progress}}" />
    <input type="hidden" id="form-template-id-input" name="meta_template_id" value="{{selected_template_id}}" />
    <input type="hidden" id="form-template-slug-input" name="meta_template_slug" value="{{selected_template_slug}}" />
    <input type="hidden" id="form-schema-input" name="meta_schema_type" value="{{meta_schema_type}}" />
    <input type="hidden" id="form-status-input" name="status" value="{{node_status}}" />
    <input type="hidden" id="form-visibility-input" name="visibility" value="{{node_visibility}}" />
    <input type="hidden" id="form-tags-input" name="meta_tags" value="{{existing_tags_string}}" />
    <input type="hidden" id="form-translation-group-id" name="translation_group_id" value="{{translation_group_id}}" />

    <header class="h-14 bg-[var(--admin-chrome)] border-b border-[var(--admin-border)] px-3 md:px-6 flex items-center justify-between shrink-0 z-10 gap-2 md:gap-4">
        <div class="flex items-center space-x-2 md:space-x-2.5 flex-1 min-w-0">
            <button
                type="button"
                id="editor-mobile-menu-btn"
                onclick="window.toggleMobileSidebarDrawer && window.toggleMobileSidebarDrawer()"
                class="md:hidden w-8 h-8 rounded-lg text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] hover:bg-[var(--admin-surface-hover)] border border-[var(--admin-border)] transition inline-flex items-center justify-center shrink-0 cursor-pointer"
                title="{{toggle_collapse}}"
            >
                <span class="material-symbols-outlined text-[18px]">menu</span>
            </button>
            <a href="{{back_href}}" class="inline-flex items-center space-x-1.5 px-2 py-1 rounded-lg text-xs font-semibold text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] hover:bg-[var(--admin-surface-hover)] transition shrink-0 whitespace-nowrap" title="{{return_list}}">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                <span class="hidden sm:inline">{{nav_module_label}}</span>
            </a>
            <span class="hidden sm:inline text-[var(--admin-border)] text-sm select-none shrink-0">/</span>

            <input
                type="text"
                id="article-title-input"
                name="title"
                value="{{node_title}}"
                placeholder="{{placeholder_title}}"
                class="text-base font-black text-[var(--admin-text)] placeholder-stone-400 border-none outline-none w-full bg-transparent focus:ring-0"
            />
        </div>

        <div class="flex items-center space-x-2 shrink-0">
            <div id="editor-view-toggle" class="h-8 inline-flex items-center p-0.5 rounded-lg bg-[var(--admin-surface)] border border-[var(--admin-border)] shrink-0">
                <button type="button" data-mode="edit" onclick="window.setEditorViewMode && window.setEditorViewMode('edit')" class="h-full px-2.5 rounded-md text-[13px] font-semibold transition-colors cursor-pointer bg-[var(--admin-accent-soft)] text-[var(--admin-accent-text)] flex items-center">{{view_mode_edit}}</button>
                <button type="button" data-mode="split" onclick="window.setEditorViewMode && window.setEditorViewMode('split')" class="h-full px-2.5 rounded-md text-[13px] font-semibold transition-colors cursor-pointer text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] flex items-center">{{view_mode_split}}</button>
            </div>

            {{preview_top_btn_html}}

            <button
                type="button"
                id="article-save-top-btn"
                onclick="const st = document.getElementById('form-status-input')?.value || 'published'; window.submitWithStatus(st);"
                class="h-8 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] font-semibold text-[13px] px-3.5 rounded-lg transition-colors duration-75 flex items-center space-x-1.5 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">save</span>
                <span>{{common.save}}</span>
            </button>

            <button
                type="button"
                id="editor-sidebar-toggle-btn"
                onclick="toggleEditorSidebar()"
                class="w-8 h-8 rounded-lg text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] hover:bg-[var(--admin-surface-hover)] border border-[var(--admin-border)] transition flex items-center justify-center cursor-pointer"
                title="{{toggle_collapse}}"
            >
                <span id="editor-sidebar-toggle-icon" class="material-symbols-outlined text-[16px]">dock_to_right</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex min-h-0 overflow-hidden relative">

        <div class="flex-1 flex flex-col min-w-0 bg-[var(--admin-canvas)] overflow-hidden">
            <div class="flex-1 flex min-h-0 relative overflow-hidden">
                <div id="editor-pane-source" class="w-full min-w-0 h-full flex flex-col overflow-hidden relative bg-[var(--admin-canvas)]">
                    <div id="editor-source-inner" class="w-full max-w-4xl mx-auto flex-1 flex flex-col min-h-0 px-4 md:px-8 pt-4 md:pt-6 pb-4 gap-3 md:gap-4">
                        <div class="w-fit max-w-full mx-auto h-[38px] p-1 rounded-lg border border-[var(--admin-border)] bg-[var(--admin-surface)] flex items-center flex-nowrap gap-[2px] text-[var(--admin-text-muted)] select-none shrink-0 overflow-x-auto thin-scrollbar">
                            <button type="button" onclick="insertFormat('**', '**')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md text-sm font-semibold leading-none cursor-pointer" title="{{format_bold}}">B</button>
                            <button type="button" onclick="insertFormat('*', '*')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md text-sm font-semibold italic font-serif leading-none cursor-pointer" title="{{format_italic}}">I</button>
                            <button type="button" onclick="insertFormat('~~', '~~')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md text-sm font-semibold line-through leading-none cursor-pointer" title="{{format_strikethrough}}">S</button>
                            <span class="w-px h-4 bg-[var(--admin-border)] mx-0.5 shrink-0"></span>
                            <button type="button" onclick="insertHeading('# ')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md text-sm font-semibold leading-none cursor-pointer" title="{{format_h1}}">H1</button>
                            <button type="button" onclick="insertHeading('## ')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md text-sm font-semibold leading-none cursor-pointer" title="{{format_h2}}">H2</button>
                            <button type="button" onclick="insertHeading('### ')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md text-sm font-semibold leading-none cursor-pointer" title="{{format_h3}}">H3</button>
                            <span class="w-px h-4 bg-[var(--admin-border)] mx-0.5 shrink-0"></span>
                            <button type="button" onclick="insertFormat('> ')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_quote}}"><svg class="w-4 h-4" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="m228-240 92-160q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 23-5.5 42.5T458-480L320-240h-92Zm360 0 92-160q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 23-5.5 42.5T818-480L680-240h-92ZM320-500q25 0 42.5-17.5T380-560q0-25-17.5-42.5T320-620q-25 0-42.5 17.5T260-560q0 25 17.5 42.5T320-500Zm360 0q25 0 42.5-17.5T740-560q0-25-17.5-42.5T680-620q-25 0-42.5 17.5T620-560q0 25 17.5 42.5T680-500Z"/></svg></button>
                            <button type="button" onclick="insertFormat('`', '`')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_code_inline}}"><span class="material-symbols-outlined text-[16px]">code</span></button>
                            <button type="button" onclick="insertFormat('```typescript\n', '\n```')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_code_block}}"><span class="material-symbols-outlined text-[16px]">data_object</span></button>
                            <span class="w-px h-4 bg-[var(--admin-border)] mx-0.5 shrink-0"></span>
                            <button type="button" onclick="insertHeading('- ')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_ul}}"><span class="material-symbols-outlined text-[16px]">format_list_bulleted</span></button>
                            <button type="button" onclick="insertHeading('1. ')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_ol}}"><span class="material-symbols-outlined text-[16px]">format_list_numbered</span></button>
                            <button type="button" onclick="insertHeading('- [ ] ')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_task}}"><span class="material-symbols-outlined text-[16px]">check_box</span></button>
                            <span class="w-px h-4 bg-[var(--admin-border)] mx-0.5 shrink-0"></span>
                            <button type="button" onclick="insertTable()" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_table}}"><span class="material-symbols-outlined text-[16px]">table_chart</span></button>
                            <button type="button" onclick="insertFormat('\n---\n')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_hr}}"><span class="material-symbols-outlined text-[16px]">horizontal_rule</span></button>
                            <button type="button" onclick="insertFormat('[]( ', ')')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_link}}"><span class="material-symbols-outlined text-[16px]">link</span></button>
                            <button type="button" onclick="insertFormat('![]( ', ')')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-text)] rounded-md cursor-pointer" title="{{format_image}}"><span class="material-symbols-outlined text-[16px]">image</span></button>
                            <button type="button" onclick="insertFormat('[[', ']]')" class="w-7 h-7 shrink-0 inline-flex items-center justify-center hover:bg-[var(--admin-surface-hover)] hover:text-[var(--admin-accent-text)] rounded-md cursor-pointer transition-colors" title="{{format_wiki}}"><span class="material-symbols-outlined text-[16px]">hub</span></button>
                        </div>

                        <textarea
                            id="editor-core"
                            name="content_raw"
                            placeholder="{{placeholder_content}}"
                            spellcheck="false"
                            class="w-full flex-1 font-mono text-sm leading-[1.75] outline-none resize-none bg-transparent text-[var(--admin-text)] placeholder-stone-400 dark:placeholder-stone-600 overflow-y-auto thin-scrollbar"
                        >{{latest_content_raw}}</textarea>
                    </div>
                </div>

                <div
                    id="preview-core"
                    class="hidden w-1/2 min-w-0 h-full px-10 lg:px-12 pt-[78px] pb-6 walnut-prose overflow-y-auto thin-scrollbar bg-[var(--admin-canvas)] text-[var(--admin-text)] border-l border-[var(--admin-border)]"
                ></div>

                <div id="vcs-diff-banner" class="hidden absolute top-3 right-6 bg-[var(--admin-surface)] text-[var(--admin-text)] text-xs px-4 py-2 rounded-xl shadow-xl border border-[var(--admin-border)] flex items-center space-x-3 z-20">
                    <span id="vcs-diff-label" class="font-bold">{{preview_label}}</span>
                    <button type="button" onclick="returnToLiveEdit()" class="text-[var(--admin-accent-text)] hover:underline font-bold cursor-pointer">{{btn_return_live_edit}}</button>
                </div>
            </div>
        </div>

        <aside
            id="editor-inspector-sidebar"
            style="width: 330px; min-width: 330px; max-width: 330px;"
            class="bg-[var(--admin-chrome)] flex flex-col overflow-hidden shrink-0 border-l border-[var(--admin-border)] transition-colors duration-75 ease-out"
        >
            {{inspector_sidebar_html}}
        </aside>
    </div>
</form>

<script type="application/json" id="vcs-versions-data">{{vcs_versions_json}}</script>
<script type="application/json" id="article-tags-data">{{article_tags_json}}</script>
<script type="application/json" id="theme-md-components-data">WALNUT_MD_COMPONENTS_JSON_PLACEHOLDER</script>
<input type="hidden" id="msg-no-outgoing-links" value="{{no_outgoing_links}}" />

<script src="/admin/js/md-preview.js" defer></script>
{{modal_new_schema}}
<script src="/admin/js/editor.js"></script>
<script src="/admin/js/datasets-schemas.js?v={{engine_version}}" defer></script>
