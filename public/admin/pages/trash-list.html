<script src="/admin/js/md-preview.js" defer></script>

<div class="p-8 overflow-y-auto h-full flex flex-col min-h-0 space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 shrink-0">
        <div class="flex items-center space-x-3">
            <a href="{{back_href}}" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </a>
            <div>
                <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">{{trash_title}}</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">{{trash_subtitle}}</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button
                type="button"
                hx-post="/admin/trash/api/empty?category={{active_tab}}"
                hx-swap="none"
                hx-confirm="{{confirm_empty_trash}}"
                class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm transition flex items-center space-x-1.5 cursor-pointer {{empty_trash_button_class}}"
            >
                <span class="material-symbols-outlined text-[16px]">delete_forever</span>
                <span>{{btn_empty_trash}}</span>
            </button>
        </div>
    </div>

    <div class="flex space-x-2 border-b border-slate-200 dark:border-slate-800 text-xs font-bold shrink-0">
        <a
            href="/admin/trash?tab=article"
            class="px-4 py-2.5 border-b-2 transition flex items-center space-x-1.5 {{tab_article_class}}"
        >
            <span class="material-symbols-outlined text-[16px]">article</span>
            <span>{{tab_articles}} ({{article_count}})</span>
        </a>
        <a
            href="/admin/trash?tab=micro"
            class="px-4 py-2.5 border-b-2 transition flex items-center space-x-1.5 {{tab_micro_class}}"
        >
            <span class="material-symbols-outlined text-[16px]">edit_note</span>
            <span>{{tab_micro}} ({{micro_count}})</span>
        </a>
    </div>

    <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex items-center justify-between gap-4">
        <div class="flex-1 flex items-center space-x-2 bg-slate-50 dark:bg-slate-950 px-3.5 py-2 rounded-xl border border-slate-200/60 dark:border-slate-800">
            <span class="material-symbols-outlined text-slate-400 text-[18px]">search</span>
            <input
                type="text"
                id="trash-search-input"
                placeholder="{{search_placeholder}}"
                oninput="window.filterCardItems('trash-groups-container', '.trash-group-card', this.value, 'trash-filter-count', 'trash-empty-state')"
                class="bg-transparent text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 outline-none w-full font-medium"
            />
        </div>
        <div id="trash-filter-count" class="text-xs font-mono font-bold text-slate-500 dark:text-slate-400 shrink-0 px-1">
            {{total_records_text}}
        </div>
    </div>

    <div id="trash-batch-toolbar" class="hidden bg-slate-900 dark:bg-slate-800 text-white px-5 py-2.5 rounded-xl shadow-lg flex items-center justify-between text-xs shrink-0 transition-all">
        <div class="flex items-center space-x-4">
            <span id="trash-selected-badge" class="font-bold font-mono text-emerald-400">{{selected_count_zero}}</span>
            <button type="button" onclick="selectAllTrashGroups()" class="text-slate-300 hover:text-white underline">{{btn_select_all}}</button>
            <button type="button" onclick="deselectAllTrashGroups()" class="text-slate-300 hover:text-white underline">{{btn_deselect_all}}</button>
        </div>

        <div class="flex items-center space-x-3">
            <button type="button" onclick="batchRestoreSelectedArticles()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-bold flex items-center space-x-1 cursor-pointer">
                <span class="material-symbols-outlined text-[14px]">restore_from_trash</span>
                <span>{{btn_batch_restore}}</span>
            </button>
            <button type="button" onclick="batchHardDeleteSelectedArticles()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg font-bold flex items-center space-x-1 cursor-pointer">
                <span class="material-symbols-outlined text-[14px]">delete_forever</span>
                <span>{{btn_batch_hard_delete}}</span>
            </button>
        </div>
    </div>

    <div id="trash-groups-container" class="space-y-4 flex-1 overflow-y-auto">
        {{trash_groups_content}}

        <div id="trash-empty-state" class="hidden p-12 text-center text-slate-400 text-xs">
            {{no_matching_records}}
        </div>
    </div>
</div>

{{snapshot_preview_modal}}
