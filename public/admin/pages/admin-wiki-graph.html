<div class="p-8 h-full flex flex-col min-h-0 space-y-4 w-full">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 shrink-0">
        <div>
            <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">{{wiki_title}}</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">{{wiki_subtitle}}</p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <input
                type="text"
                id="admin-wiki-search-input"
                placeholder="{{search_nodes}}"
                oninput="window.highlightAdminWikiNode && window.highlightAdminWikiNode(this.value)"
                class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white outline-none focus:border-emerald-500 shadow-sm w-44"
            />
            <button
                type="button"
                id="wiki-physics-toggle"
                onclick="window.toggleWikiPhysics && window.toggleWikiPhysics()"
                class="bg-emerald-600/80 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-mono shadow-sm transition flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">motion_photos_on</span>
                <span>{{btn_toggle_physics}}</span>
            </button>
            <button
                type="button"
                id="wiki-orbit-toggle"
                onclick="window.toggleWikiAutoOrbit && window.toggleWikiAutoOrbit()"
                class="bg-emerald-600/80 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-sm transition flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">360</span>
                <span>{{btn_auto_orbit}}</span>
            </button>
            <button
                type="button"
                id="wiki-timelapse-toggle"
                onclick="window.toggleWikiTimeLapse && window.toggleWikiTimeLapse()"
                class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-bold border border-slate-200/80 dark:border-slate-700 shadow-sm transition flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">history</span>
                <span>{{btn_timelapse}}</span>
            </button>
            <button
                type="button"
                id="wiki-layout-toggle"
                onclick="window.toggleWikiHierarchyLayout && window.toggleWikiHierarchyLayout()"
                class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-bold border border-slate-200/80 dark:border-slate-700 shadow-sm transition flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">reorder</span>
                <span>{{btn_toggle_layout}}</span>
            </button>
            <button
                type="button"
                id="wiki-isolated-toggle"
                onclick="window.toggleHighlightIsolated && window.toggleHighlightIsolated()"
                class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-bold border border-slate-200/80 dark:border-slate-700 shadow-sm transition flex items-center space-x-1 cursor-pointer"
                title="{{filter_isolated_hint}}"
            >
                <span class="material-symbols-outlined text-[16px]">link_off</span>
                <span>{{btn_toggle_isolated}}</span>
            </button>
            <button
                type="button"
                id="wiki-dirty-toggle"
                onclick="window.toggleHighlightDirty && window.toggleHighlightDirty()"
                class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-bold border border-slate-200/80 dark:border-slate-700 shadow-sm transition flex items-center space-x-1 cursor-pointer"
                title="{{filter_dirty_hint}}"
            >
                <span class="material-symbols-outlined text-[16px]">warning</span>
                <span>{{btn_toggle_dirty}}</span>
            </button>
            <button
                type="button"
                onclick="window.resetAdminWikiView && window.resetAdminWikiView()"
                class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-bold border border-slate-200/80 dark:border-slate-700 shadow-sm transition flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[16px]">filter_center_focus</span>
                <span>{{btn_reset_view}}</span>
            </button>
            {{slot_graph_pro_toolbar}}
        </div>
    </div>

    <div class="bg-[#0b0f19] rounded-2xl border border-slate-800 shadow-2xl overflow-hidden flex-1 min-h-0 relative">
        <div class="absolute top-4 left-4 z-20 flex items-center space-x-2 text-xs font-mono text-emerald-400 bg-slate-900/80 px-3.5 py-1.5 rounded-xl border border-slate-800 backdrop-blur-md">
            <span class="material-symbols-outlined text-[16px]">hub</span>
            <span id="admin-wiki-stats"></span>
        </div>

        <div id="admin-wiki-legend" class="absolute bottom-4 left-4 z-20 hidden sm:flex items-center space-x-1.5 text-[11px] font-mono text-slate-300 bg-slate-900/85 px-2.5 py-1.5 rounded-xl border border-slate-800 backdrop-blur-md">
            <button type="button" data-filter-type="route" onclick="window.toggleWikiTypeFilter && window.toggleWikiTypeFilter('route', this)" class="flex items-center space-x-1 px-2 py-0.5 rounded-lg hover:bg-slate-800 transition cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span><span>{{type_route}}</span></button>
            <button type="button" data-filter-type="page" onclick="window.toggleWikiTypeFilter && window.toggleWikiTypeFilter('page', this)" class="flex items-center space-x-1 px-2 py-0.5 rounded-lg hover:bg-slate-800 transition cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span><span>{{type_page}}</span></button>
            <button type="button" data-filter-type="article" onclick="window.toggleWikiTypeFilter && window.toggleWikiTypeFilter('article', this)" class="flex items-center space-x-1 px-2 py-0.5 rounded-lg hover:bg-slate-800 transition cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block"></span><span>{{type_article}}</span></button>
            <button type="button" data-filter-type="micro" onclick="window.toggleWikiTypeFilter && window.toggleWikiTypeFilter('micro', this)" class="flex items-center space-x-1 px-2 py-0.5 rounded-lg hover:bg-slate-800 transition cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span><span>{{type_micro}}</span></button>
            <button type="button" data-filter-type="dataset" onclick="window.toggleWikiTypeFilter && window.toggleWikiTypeFilter('dataset', this)" class="flex items-center space-x-1 px-2 py-0.5 rounded-lg hover:bg-slate-800 transition cursor-pointer"><span class="w-2.5 h-2.5 rounded-full bg-cyan-400 inline-block"></span><span>{{type_dataset}}</span></button>
        </div>

        <div
            id="admin-wiki-hover-card"
            class="hidden absolute z-30 pointer-events-none bg-slate-950/90 text-white p-3 rounded-xl shadow-2xl border border-emerald-500/40 backdrop-blur-md max-w-xs space-y-1"
        >
            <h4 id="admin-hover-title" class="font-bold text-xs text-white"></h4>
            <div id="admin-hover-slug" class="text-[10px] font-mono text-slate-400"></div>
            <div id="admin-hover-degree" class="text-[10px] font-mono text-emerald-400 font-bold"></div>
        </div>

        <div
            id="admin-wiki-inspector"
            class="hidden absolute top-4 bottom-4 right-4 z-30 w-80 bg-slate-900/90 text-white p-5 rounded-2xl shadow-2xl border border-slate-700/80 backdrop-blur-md flex flex-col justify-between space-y-4 overflow-y-auto"
        >
            <div class="space-y-4">
                <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                        <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                            <span id="inspector-node-type" class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-mono text-[10px] font-bold uppercase"></span>
                            <span id="inspector-node-status" class="px-1.5 py-0.5 rounded font-mono text-[10px] font-bold"></span>
                        </div>
                        <h4 id="inspector-node-title" class="font-bold text-sm text-white mt-2 break-words"></h4>
                        <div id="inspector-node-path" class="text-[11px] font-mono text-slate-400 break-all mt-1"></div>
                        <div id="inspector-node-created" class="text-[10px] font-mono text-slate-500 mt-1"></div>
                    </div>
                    <button type="button" onclick="window.closeWikiInspector && window.closeWikiInspector()" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer shrink-0">
                        <span class="material-symbols-outlined text-[16px]">close</span>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-[11px] font-mono">
                    <div class="bg-slate-950/70 px-3 py-2 rounded-xl border border-slate-800">
                        <div class="text-[10px] text-slate-500">{{wiki.inspector_upstream}}</div>
                        <div id="inspector-node-in" class="text-sky-400 font-bold mt-0.5"></div>
                    </div>
                    <div class="bg-slate-950/70 px-3 py-2 rounded-xl border border-slate-800">
                        <div class="text-[10px] text-slate-500">{{wiki.inspector_downstream}}</div>
                        <div id="inspector-node-out" class="text-amber-400 font-bold mt-0.5"></div>
                    </div>
                </div>
                <div id="inspector-relations-lists" class="space-y-3 pt-1">
                    <div>
                        <div class="text-[10px] font-mono uppercase tracking-wider text-sky-400/90 mb-1.5">{{wiki.inspector_upstream}}</div>
                        <div id="inspector-upstream-list" class="space-y-1 max-h-36 overflow-y-auto pr-1"></div>
                    </div>
                    <div>
                        <div class="text-[10px] font-mono uppercase tracking-wider text-amber-400/90 mb-1.5">{{wiki.inspector_downstream}}</div>
                        <div id="inspector-downstream-list" class="space-y-1 max-h-36 overflow-y-auto pr-1"></div>
                    </div>
                </div>
            </div>
            <div class="space-y-2 pt-3 border-t border-slate-800">
                <div class="flex items-center space-x-2">
                    <a id="inspector-btn-edit" href="#" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-2.5 rounded-xl flex items-center justify-center space-x-1 transition-colors duration-75">
                        <span class="material-symbols-outlined text-[14px]">edit</span>
                        <span>{{wiki.inspector_edit}}</span>
                    </a>
                    <a id="inspector-btn-view" href="#" target="_blank" rel="noopener" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2 px-2.5 rounded-xl border border-slate-700 flex items-center justify-center space-x-1 transition-colors duration-75">
                        <span class="material-symbols-outlined text-[14px]">open_in_new</span>
                        <span>{{wiki.inspector_view}}</span>
                    </a>
                </div>
                <div id="graph-pro-inspector-slot" class="space-y-2">{{slot_graph_pro_inspector}}</div>
            </div>
        </div>

        <canvas id="admin-wiki-canvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>
    </div>
</div>

<script id="admin-wiki-raw-data" type="application/json">{{payload_json}}</script>
<script src="/admin/js/wiki-graph.js"></script>
