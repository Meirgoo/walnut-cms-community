<div class="flex items-center justify-between gap-2.5 px-3 py-2 rounded-lg border {{item_box_class}}">
    <div class="flex items-center gap-2 min-w-0 flex-1">
        <span class="material-symbols-outlined text-[15px] shrink-0 {{icon_class}}">{{icon}}</span>
        <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-[var(--admin-text)] truncate">{{title}}</div>
            <div class="text-[11px] text-[var(--admin-text-muted)] font-mono truncate {{meta_class}}">{{meta}}</div>
        </div>
    </div>
    {{action_html}}
</div>
