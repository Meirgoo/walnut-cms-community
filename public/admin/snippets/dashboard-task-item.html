<div class="dashboard-feed-row h-11 px-4 flex items-center justify-between gap-3 hover:bg-slate-50/70 dark:hover:bg-slate-700/30 transition-colors duration-75 ease-out" data-feed-module="{{item_module}}">
    <div class="flex items-center space-x-2 min-w-0 flex-1">
        <span class="inline-flex items-center space-x-1 px-1.5 py-0.5 rounded text-[10px] font-bold shrink-0 {{badge_class}}">
            <span class="material-symbols-outlined text-[12px]">{{badge_icon}}</span>
            <span>{{badge_label}}</span>
        </span>
        <span class="text-xs font-bold text-slate-900 dark:text-white truncate">{{title}}</span>
    </div>
    <div class="flex items-center space-x-2 shrink-0">
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold {{status_class}}">
            {{status_text}}
        </span>
        <span class="text-[11px] text-slate-400 font-mono hidden sm:inline">{{time}}</span>
    </div>
</div>
