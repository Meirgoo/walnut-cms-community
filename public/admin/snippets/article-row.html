<tr id="article-row-{{id}}" data-folder="{{folder}}" class="h-11 hover:bg-slate-50/60 dark:hover:bg-slate-700/30 transition-colors duration-75 ease-out">
    <td class="w-12 px-4 py-2 text-center">
        <input
            type="checkbox"
            class="row-select-box w-4 h-4 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600 dark:accent-emerald-500"
            data-id="{{id}}"
            onchange="window.updateTableBatchState('articles-table')"
        />
    </td>
    <td class="px-6 py-2 text-left" data-col="title" data-sort-val="{{title}}">
        {{title_html}}
    </td>
    <td class="px-6 py-2 text-center col-folder whitespace-nowrap" data-col="folder">
        <span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 whitespace-nowrap">
            <span class="material-symbols-outlined text-[13px] text-amber-500">folder</span>
            <span>{{folder}}</span>
        </span>
    </td>
    <td class="px-6 py-2 text-center col-trans-group hidden max-w-[160px] truncate" data-col="trans-group">
        {{trans_group_badge_html}}
    </td>
    <td class="px-6 py-2 text-left font-mono text-xs text-slate-500 dark:text-slate-400 col-slug hidden whitespace-nowrap" data-col="slug">
        {{slug}}
    </td>
    <td class="px-6 py-2 text-center font-mono text-xs text-slate-500 dark:text-slate-400 col-locale whitespace-nowrap" data-col="locale">
        {{locale_badges_html}}
    </td>
    <td class="px-6 py-2 text-center col-tags hidden whitespace-nowrap" data-col="tags">
        {{tags_html}}
    </td>
    <td class="px-6 py-2 text-center col-maturity hidden whitespace-nowrap" data-col="maturity">
        {{maturity_html}}
    </td>
    <td class="px-6 py-2 text-center col-status whitespace-nowrap" data-col="status">
        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold whitespace-nowrap {{status_badge_class}}">
            {{status_badge_text}}
        </span>
    </td>
    <td class="px-6 py-2 text-center text-xs font-mono text-slate-400 col-updated whitespace-nowrap" data-col="updated" data-sort-val="{{updated_at}}">
        {{updated_at_formatted}}
    </td>
    <td class="px-6 py-2 text-center space-x-3 col-actions whitespace-nowrap" data-col="actions">
        <button type="button" onclick="window.openSandboxedPreview('/{{slug}}', '{{title}}')" class="text-xs font-bold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 cursor-pointer">
            {{preview}}
        </button>
        <a href="/admin/articles/edit/{{id}}" class="text-xs font-bold text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white hover:underline">
            {{edit}}
        </a>
        <button
            type="button"
            hx-delete="/admin/articles/api/delete/{{id}}"
            hx-target="#article-row-{{id}}"
            hx-swap="outerHTML"
            hx-confirm="{{confirm_delete}}"
            class="text-xs font-bold text-red-500 hover:text-red-700 cursor-pointer"
        >
            {{delete}}
        </button>
    </td>
</tr>
