<tr id="page-row-{{id}}" data-folder="{{folder}}" data-search-text="{{search_text}}" class="h-11 hover:bg-stone-50/60 dark:hover:bg-stone-700/30 transition-colors duration-75 ease-out">
    <td class="w-12 px-4 py-2 text-center">
        <input
            type="checkbox"
            class="row-select-box w-4 h-4 rounded border-stone-300 dark:border-stone-600 bg-[var(--admin-surface)] text-amber-600 focus:ring-amber-500 cursor-pointer accent-amber-600 dark:accent-amber-500"
            data-id="{{id}}"
            onchange="window.updateTableBatchState('pages-table')"
        />
    </td>
    <td class="px-6 py-2 text-left" data-col="title" data-sort-val="{{title}}">
        <div class="flex items-center space-x-2 min-w-0">
            <a href="/admin/pages/edit/{{id}}" class="font-bold text-stone-900 dark:text-white hover:text-amber-700 dark:hover:text-amber-400 truncate">{{title}}</a>
            {{route_path_html}}
        </div>
    </td>
    <td class="px-6 py-2 text-center col-folder hidden whitespace-nowrap" data-col="folder">
        <span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded text-[11px] font-medium bg-stone-100 dark:bg-stone-700 text-stone-600 dark:text-stone-300 whitespace-nowrap">
            <span class="material-symbols-outlined text-[13px] text-amber-500">folder</span>
            <span>{{folder}}</span>
        </span>
    </td>
    <td class="px-6 py-2 text-center col-template max-w-[160px] truncate" data-col="template" title="{{template_name}}">
        <span class="font-mono text-xs px-2.5 py-0.5 rounded-full bg-stone-100 dark:bg-stone-700 text-stone-700 dark:text-stone-300 font-medium inline-block max-w-[140px] truncate align-middle">
            {{template_name}}
        </span>
    </td>
    <td class="px-6 py-2 text-center font-mono text-xs text-stone-500 dark:text-stone-400 col-locale whitespace-nowrap" data-col="locale">
        {{translation_pills_html}}
    </td>
    <td class="px-6 py-2 text-center col-status whitespace-nowrap" data-col="status">
        <span class="{{status_badge_class}}">
            {{status_text}}
        </span>
    </td>
    <td class="px-6 py-2 text-center text-xs text-[var(--admin-text-muted)] col-updated whitespace-nowrap" data-col="updated" data-sort-val="{{updated_at}}" title="{{updated_at_full}}">
        {{updated_at_formatted}}
    </td>
    <td class="px-6 py-2 text-center space-x-2 col-actions whitespace-nowrap" data-col="actions">
        {{preview_html}}
        <a href="/admin/pages/edit/{{id}}" class="text-xs font-medium text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] transition">
            {{edit}}
        </a>
        <button
            type="button"
            hx-delete="/admin/pages/api/delete/{{id}}"
            hx-target="#page-row-{{id}}"
            hx-swap="outerHTML"
            hx-confirm="{{confirm_delete}}"
            title="{{btn_move_to_trash}}"
            class="p-1 rounded-md list-action-trash cursor-pointer inline-flex items-center justify-center align-middle"
        >
            <span class="material-symbols-outlined text-[16px]">delete</span>
        </button>
    </td>
</tr>
