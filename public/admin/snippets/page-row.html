<tr id="page-row-{{id}}" data-folder="{{folder}}" class="h-11 hover:bg-slate-50/60 dark:hover:bg-slate-700/30 transition-colors duration-75 ease-out">
    <td class="w-12 px-4 py-2 text-center">
        <input
            type="checkbox"
            class="row-select-box w-4 h-4 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600 dark:accent-emerald-500"
            data-id="{{id}}"
            onchange="window.updateTableBatchState('pages-table')"
        />
    </td>
    <td class="px-6 py-2 text-left" data-col="title" data-sort-val="{{title}}">
        <div class="flex items-center space-x-2 min-w-0">
            <a href="/admin/pages/edit/{{id}}" class="font-bold text-slate-900 dark:text-white hover:text-emerald-700 dark:hover:text-emerald-400 truncate">{{title}}</a>
            {{route_path_html}}
        </div>
    </td>
    <td class="px-6 py-2 text-center col-folder hidden whitespace-nowrap" data-col="folder">
        <span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 whitespace-nowrap">
            <span class="material-symbols-outlined text-[13px] text-amber-500">folder</span>
            <span>{{folder}}</span>
        </span>
    </td>
    <td class="px-6 py-2 text-center col-template max-w-[160px] truncate" data-col="template" title="{{template_name}}">
        <span class="font-mono text-xs px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium inline-block max-w-[140px] truncate align-middle">
            {{template_name}}
        </span>
    </td>
    <td class="px-6 py-2 text-center font-mono text-xs text-slate-500 dark:text-slate-400 col-locale whitespace-nowrap" data-col="locale">
        {{translation_pills_html}}
    </td>
    <td class="px-6 py-2 text-center col-status whitespace-nowrap" data-col="status">
        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold whitespace-nowrap {{status_badge_class}}">
            {{status_text}}
        </span>
    </td>
    <td class="px-6 py-2 text-center text-xs font-mono text-slate-400 col-updated whitespace-nowrap" data-col="updated" data-sort-val="{{updated_at}}">
        {{updated_at_formatted}}
    </td>
    <td class="px-6 py-2 text-center space-x-3 col-actions whitespace-nowrap" data-col="actions">
        {{preview_html}}
        <a href="/admin/pages/edit/{{id}}" class="text-xs font-bold text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white hover:underline">
            {{edit}}
        </a>
        <button
            type="button"
            hx-delete="/admin/pages/api/delete/{{id}}"
            hx-target="#page-row-{{id}}"
            hx-swap="outerHTML"
            hx-confirm="{{confirm_delete}}"
            class="text-xs font-bold text-red-500 hover:text-red-700 cursor-pointer"
        >
            {{delete}}
        </button>
    </td>
</tr>
