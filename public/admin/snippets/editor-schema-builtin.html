<div id="schema-fields-default" class="schema-fields-group {{class_default}} text-slate-400 text-[11px] p-2 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800">
    {{desc_default}}
</div>
<div id="schema-fields-game" class="schema-fields-group {{class_game}} space-y-2 bg-slate-50 dark:bg-slate-950 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
    <input type="text" name="meta_developer" value="{{developer}}" placeholder="{{placeholder_developer}}" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100" />
    <input type="text" name="meta_platform" value="{{platform}}" placeholder="{{placeholder_platform}}" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100" />
    <input type="text" name="meta_release_date" value="{{release_date}}" placeholder="{{placeholder_release_date}}" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100" />
</div>
<div id="schema-fields-book" class="schema-fields-group {{class_book}} space-y-2 bg-slate-50 dark:bg-slate-950 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
    <input type="text" name="meta_author" value="{{author}}" placeholder="{{placeholder_author}}" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100" />
    <input type="text" name="meta_publisher" value="{{publisher}}" placeholder="{{placeholder_publisher}}" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100" />
    <input type="text" name="meta_isbn" value="{{isbn}}" placeholder="{{placeholder_isbn}}" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100" />
</div>
