<div id="theme-card-{{id}}" class="bg-[var(--admin-surface)] rounded-2xl border p-5 shadow-sm flex flex-col justify-between transition min-h-[200px] {{border_class}}">
    <div class="space-y-2.5">
        <div class="flex justify-between items-center h-6">
            <div class="flex items-center space-x-1.5 truncate">
                <span class="text-[10px] font-mono font-semibold bg-[var(--admin-chrome)] text-[var(--admin-text-muted)] px-2 py-0.5 rounded truncate max-w-[110px]">{{slug}}</span>
                <span class="list-pill list-pill-locale {{repo_badge_class}} flex items-center space-x-1 shrink-0" title="{{repo_url}}"><span class="material-symbols-outlined text-[12px]">code</span><span>{{themes.badge_repo}}</span></span>
                <span class="bg-[var(--admin-chrome)] text-[var(--admin-text-muted)] px-1.5 py-0.5 rounded text-[10px] font-mono shrink-0">v{{version}}</span>
            </div>
            <div class="shrink-0">
                {{status_badge_html}}
            </div>
        </div>
        <div class="pb-1">
            <h4 class="text-sm font-bold text-[var(--admin-text)] truncate" title="{{title}}">{{title}}</h4>
            <p class="text-xs text-[var(--admin-text-muted)] line-clamp-2 leading-relaxed mt-1.5">{{summary}}</p>
        </div>
    </div>

    <div class="pt-3 border-t border-[var(--admin-border)] flex justify-between items-center text-xs shrink-0 h-11">
        <div class="flex items-center space-x-1 shrink-0">
            <button type="button" hx-post="/admin/themes/api/activate/{{id}}" class="h-8 px-3 rounded-lg bg-[var(--admin-accent-soft)] hover:bg-[var(--admin-accent-border)]/40 text-[var(--admin-accent-text)] border border-[var(--admin-accent-border)] font-semibold text-xs transition cursor-pointer {{activate_btn_class}}">
                {{btn_set_active}}
            </button>
        </div>

        <div class="flex items-center space-x-1 shrink-0">
            <button type="button" onclick="window.openThemeVersionsModal('{{id}}', '{{title}}', '{{slug}}')" class="p-1.5 rounded-lg text-[var(--admin-text-muted)] hover:text-[var(--admin-accent-text)] hover:bg-[var(--admin-accent-soft)] transition cursor-pointer" title="{{themes.tip_version_history}}">
                <span class="material-symbols-outlined text-[16px]">history</span>
            </button>
            <button type="button" hx-post="/admin/themes/api/update/{{id}}" class="p-1.5 rounded-lg text-[var(--admin-text-muted)] hover:text-[var(--admin-accent-text)] hover:bg-[var(--admin-accent-soft)] transition cursor-pointer {{update_btn_class}}" title="{{themes.tip_update_theme}}">
                <span class="material-symbols-outlined text-[16px]">sync</span>
            </button>
            <button type="button" hx-delete="/admin/themes/api/{{id}}" hx-confirm="{{confirm_delete_theme}}" class="p-1.5 rounded-lg list-action-trash transition cursor-pointer {{delete_btn_class}}" title="{{themes.tip_move_trash}}">
                <span class="material-symbols-outlined text-[16px]">delete</span>
            </button>
        </div>
    </div>
</div>
