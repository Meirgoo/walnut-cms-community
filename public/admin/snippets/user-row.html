<tr id="user-row-{{id}}" data-folder="{{folder}}" class="hover:bg-stone-50/60 dark:hover:bg-stone-700/30 transition">
    <td class="w-12 px-4 py-3.5 text-center">
        <input
            type="checkbox"
            class="row-select-box w-4 h-4 rounded border-stone-300 dark:border-stone-600 bg-[var(--admin-surface)] text-amber-600 focus:ring-amber-500 cursor-pointer accent-amber-600 dark:accent-amber-500"
            data-id="{{id}}"
            onchange="window.updateTableBatchState('users-table')"
        />
    </td>
    <td class="px-6 py-3.5 text-left" data-col="username" data-sort-val="{{username}}">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full bg-[var(--admin-accent-soft)] text-[var(--admin-accent-text)] font-bold flex items-center justify-center text-xs border border-[var(--admin-accent-border)]">
                {{avatar_initial}}
            </div>
            <div>
                <div class="font-bold text-stone-900 dark:text-white flex items-center space-x-1.5">
                    <span>{{username}}</span>
                    {{current_user_badge_html}}
                </div>
                <div class="text-[11px] text-stone-400 font-mono">ID: {{id}}</div>
            </div>
        </div>
    </td>
    <td class="px-6 py-3.5 text-center user-col-folder" data-col="folder">
        <span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded text-[11px] font-medium bg-stone-100 dark:bg-stone-700 text-stone-600 dark:text-stone-300">
            <span class="material-symbols-outlined text-[13px] text-amber-500">folder</span>
            <span>{{folder}}</span>
        </span>
    </td>
    <td class="px-6 py-3.5 text-left font-mono text-xs text-stone-600 dark:text-stone-300 user-col-email" data-col="email" data-sort-val="{{email}}">
        {{email}}
    </td>
    <td class="px-6 py-3.5 text-center user-col-global-role" data-col="global-role" data-sort-val="{{global_role}}">
        <span class="font-mono text-xs {{global_role_badge_class}}">
            {{global_role_text}}
        </span>
    </td>
    <td class="px-6 py-3.5 text-center user-col-site-role" data-col="site-role" data-sort-val="{{site_role}}">
        <span class="font-mono text-xs {{site_role_badge_class}}">
            {{site_role_text}}
        </span>
    </td>
    <td class="px-6 py-3.5 text-center text-xs font-mono text-stone-400 user-col-created" data-col="created" data-sort-val="{{created_at}}">
        {{created_at_formatted}}
    </td>
    <td class="px-6 py-3.5 text-center user-col-actions" data-col="actions">
        {{actions_html}}
    </td>
</tr>
