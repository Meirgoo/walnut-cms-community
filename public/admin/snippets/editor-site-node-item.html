<button
    type="button"
    onclick="window.insertWikiLink('{{slug}}')"
    class="w-full text-left px-2.5 py-1.5 hover:bg-emerald-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 hover:text-emerald-800 dark:hover:text-emerald-300 rounded-lg flex items-center justify-between cursor-pointer group transition"
    title="{{quick_insert}} [[{{slug}}]]"
>
    <span class="truncate text-[11px] font-medium">{{title}}</span>
    <span class="material-symbols-outlined text-[14px] text-slate-300 dark:text-slate-600 group-hover:text-emerald-600 dark:group-hover:text-emerald-400">add_link</span>
</button>
