<button
    type="button"
    onclick="window.insertWikiLink('{{slug}}')"
    class="w-full text-left px-2.5 py-1.5 hover:bg-amber-50 dark:hover:bg-stone-800 text-stone-700 dark:text-stone-200 hover:text-amber-800 dark:hover:text-amber-300 rounded-lg flex items-center justify-between cursor-pointer group transition"
    title="{{quick_insert}} [[{{slug}}]]"
>
    <span class="truncate text-[11px] font-medium">{{title}}</span>
    <span class="material-symbols-outlined text-[14px] text-stone-300 dark:text-stone-600 group-hover:text-amber-600 dark:group-hover:text-amber-400">add_link</span>
</button>
