<div id="component-card-{{id}}" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-5 shadow-sm space-y-3.5 flex flex-col justify-between transition hover:border-slate-300 dark:hover:border-slate-600">
    <div class="space-y-3">
        <div class="flex justify-between items-start">
            <div class="flex items-center space-x-2.5 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/70 text-blue-600 dark:text-blue-400 border border-blue-200/80 dark:border-blue-800/80 flex items-center justify-center font-bold shrink-0">
                    <span class="material-symbols-outlined text-[18px]">{{icon}}</span>
                </div>
                <div class="min-w-0">
                    <h4 class="text-sm font-bold text-slate-900 dark:text-white truncate" title="{{title}}">{{title}}</h4>
                    <p class="text-xs text-slate-400 dark:text-slate-400 font-mono mt-0.5 truncate">{{slug}} · v{{version}}</p>
                </div>
            </div>

            <div class="flex items-center shrink-0 ml-2">
                <button type="button"
                    onclick="window.openComponentContractModal && window.openComponentContractModal(this)"
                    data-title="{{safe_title}}"
                    data-slug="{{slug}}"
                    data-version="{{version}}"
                    data-slots="{{slots_attr}}"
                    data-template="{{safe_template_html}}"
                    data-props="{{safe_default_props_json}}"
                    data-schema="{{safe_props_schema_json}}"
                    class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white bg-slate-100 hover:bg-slate-200 dark:bg-slate-700/80 dark:hover:bg-slate-700 border border-slate-200/90 dark:border-slate-600/90 transition flex items-center space-x-1.5 cursor-pointer shadow-xs"
                    title="{{themes.btn_view_contract}}">
                    <span class="material-symbols-outlined text-[15px] text-blue-600 dark:text-blue-400">code</span>
                    <span>{{themes.btn_view_contract}}</span>
                </button>
            </div>
        </div>

        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-2 h-8">{{summary}}</p>

        <div class="flex items-center justify-between px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-700/80 text-xs">
            <div class="flex items-center space-x-1.5 text-slate-500 dark:text-slate-400 font-medium text-[11px] shrink-0">
                <span class="material-symbols-outlined text-[15px] text-slate-400 dark:text-slate-500">space_dashboard</span>
                <span>{{themes.slots_label}}</span>
            </div>
            <div class="flex items-center flex-wrap gap-1 justify-end">
                {{slots_badges_html}}
            </div>
        </div>
    </div>

    <div class="bg-slate-100 dark:bg-slate-950/80 p-2.5 rounded-xl border border-slate-200/80 dark:border-slate-800/80">
        <div class="rounded-lg shadow-sm ring-1 ring-black/5 dark:ring-white/10 overflow-hidden bg-white dark:bg-slate-900">
            <div class="flex items-center justify-between px-2.5 py-1.5 bg-slate-200/70 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-700/80">
                <div class="flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-rose-400/80"></span>
                    <span class="w-2 h-2 rounded-full bg-amber-400/80"></span>
                    <span class="w-2 h-2 rounded-full bg-emerald-400/80"></span>
                </div>
                <span class="text-[9px] font-mono text-slate-400 truncate max-w-[140px]">{{slug}}</span>
            </div>
            <div class="theme-preview-viewport theme-component-viewport w-full overflow-hidden relative bg-white dark:bg-slate-900 transition-[height] duration-200" style="min-height: 48px; height: 120px;">
                <iframe
                    srcdoc="{{safe_component_srcdoc}}"
                    class="pointer-events-none select-none border-0 origin-top-left absolute top-0 left-0 transition-transform duration-700 ease-out"
                    style="width: 1080px; transform: scale(var(--preview-scale, 0.35)) translateY(0px); transform-origin: top left;"
                    loading="lazy"
                    tabindex="-1"
                    onload="window.adaptThemeComponentHeight && window.adaptThemeComponentHeight(this)"
                ></iframe>
            </div>
        </div>
    </div>
</div>
