<div id="component-card-{{id}}" class="bg-[var(--admin-surface)] rounded-2xl border border-[var(--admin-border)] p-5 shadow-sm space-y-3.5 flex flex-col justify-between transition hover:border-stone-300 dark:hover:border-stone-600">
    <div class="space-y-3">
        <div class="flex justify-between items-start">
            <div class="flex items-center space-x-2.5 min-w-0">
                <div class="w-8 h-8 rounded-lg bg-[var(--admin-chrome)] text-[var(--admin-text-muted)] border border-[var(--admin-border)] flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-[18px]">{{icon}}</span>
                </div>
                <div class="min-w-0">
                    <h4 class="text-sm font-bold text-[var(--admin-text)] truncate" title="{{title}}">{{title}}</h4>
                    <p class="text-xs text-[var(--admin-text-muted)] font-mono mt-0.5 truncate">{{slug}} · v{{version}}</p>
                </div>
            </div>

            <div class="flex items-center shrink-0 ml-2">
                <button type="button"
                    onclick="window.openComponentContractModal && window.openComponentContractModal(this)"
                    data-title="{{safe_title}}"
                    data-slug="{{slug}}"
                    data-version="{{version}}"
                    data-slots="{{slots_attr}}"
                    data-template="{{safe_template_html}}"
                    data-props="{{safe_default_props_json}}"
                    data-schema="{{safe_props_schema_json}}"
                    class="h-8 px-2.5 rounded-lg text-xs font-medium text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] border border-[var(--admin-border)] transition flex items-center space-x-1.5 cursor-pointer"
                    title="{{themes.btn_view_contract}}">
                    <span class="material-symbols-outlined text-[15px]">code</span>
                    <span>{{themes.btn_view_contract}}</span>
                </button>
            </div>
        </div>

        <p class="text-xs text-[var(--admin-text-muted)] leading-relaxed line-clamp-2 min-h-[2.25rem]" title="{{summary}}">{{summary}}</p>

        <div class="flex items-center justify-between px-3 py-1.5 rounded-xl bg-[var(--admin-canvas)]/60 border border-[var(--admin-border)] text-xs">
            <div class="flex items-center space-x-1.5 text-stone-500 dark:text-stone-400 font-medium text-[11px] shrink-0">
                <span class="material-symbols-outlined text-[15px] text-stone-400 dark:text-stone-500">space_dashboard</span>
                <span>{{themes.slots_label}}</span>
            </div>
            <div class="flex items-center flex-wrap gap-1 justify-end">
                {{slots_badges_html}}
            </div>
        </div>
    </div>

    <div class="bg-stone-100 dark:bg-stone-950/80 p-2.5 rounded-xl border border-stone-200/80 dark:border-stone-800/80">
        <div class="rounded-lg shadow-sm ring-1 ring-black/5 dark:ring-white/10 overflow-hidden bg-white dark:bg-stone-900">
            <div class="flex items-center justify-between px-2.5 py-1.5 bg-stone-200/70 dark:bg-stone-800/90 border-b border-[var(--admin-border)]">
                <div class="flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-rose-400/80"></span>
                    <span class="w-2 h-2 rounded-full bg-amber-400/80"></span>
                    <span class="w-2 h-2 rounded-full bg-amber-400/80"></span>
                </div>
                <span class="text-[9px] font-mono text-stone-400 truncate max-w-[140px]">{{slug}}</span>
            </div>
            <div class="theme-preview-viewport theme-component-viewport w-full overflow-hidden relative bg-white dark:bg-stone-900 transition-[height] duration-200" style="min-height: 48px; height: 120px;">
                <iframe
                    srcdoc="{{safe_component_srcdoc}}"
                    class="pointer-events-none select-none border-0 origin-top-left absolute top-0 left-0 transition-transform duration-700 ease-out"
                    style="width: 1080px; transform: scale(var(--preview-scale, 0.35)) translateY(0px); transform-origin: top left;"
                    loading="lazy"
                    tabindex="-1"
                    onload="window.adaptThemeComponentHeight && window.adaptThemeComponentHeight(this)"
                ></iframe>
            </div>
        </div>
    </div>
</div>
