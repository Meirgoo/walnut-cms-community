<div id="template-card-{{id}}" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-5 shadow-sm flex flex-col md:flex-row gap-5 group/tpl transition hover:border-slate-300 dark:hover:border-slate-600">
    <div class="flex-1 flex flex-col justify-between space-y-4">
        <div class="space-y-2">
            <div class="flex items-start justify-between">
                <div>
                    <div class="flex items-center space-x-2">
                        <h4 class="text-sm font-bold text-slate-900 dark:text-white">{{title}}</h4>
                        <span class="bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 px-2 py-0.5 rounded text-[10px] font-bold font-mono">{{pages.badge_template}}</span>
                    </div>
                    <p class="text-xs text-slate-400 font-mono mt-0.5">/{{slug}}</p>
                </div>
            </div>
            <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">{{summary}}</p>
        </div>

        <div class="pt-2 flex items-center space-x-2">
            <button
                type="button"
                onclick="window.openCloneTemplatePageModal && window.openCloneTemplatePageModal('{{id}}', '{{safe_title}}', '{{slug}}', '{{safe_summary}}')"
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-sm cursor-pointer"
                title="{{themes.clone_page_tip}}"
            >
                <span class="material-symbols-outlined text-[15px]">content_copy</span>
                <span>{{themes.clone_page_btn}}</span>
            </button>
        </div>
    </div>

    <div class="theme-preview-viewport theme-template-viewport w-full md:w-80 aspect-[16/10] rounded-xl border border-slate-200/80 dark:border-slate-700/80 bg-white dark:bg-slate-950 overflow-hidden relative shrink-0 shadow-inner">
        <div class="w-[1280px] h-[800px] overflow-hidden pointer-events-none select-none origin-top-left" style="width: 1280px; height: 800px; transform: scale(var(--preview-scale, 0.25)); transform-origin: 0 0;">
            <iframe
                srcdoc="{{safe_template_srcdoc}}"
                class="w-[1280px] h-[2400px] border-0 pointer-events-none select-none transition-transform duration-[4500ms] ease-in-out group-hover/tpl:-translate-y-[1600px]"
                loading="lazy"
                tabindex="-1"
            ></iframe>
        </div>
    </div>
</div>
