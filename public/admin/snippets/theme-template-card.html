<div id="template-card-{{id}}" class="bg-[var(--admin-surface)] rounded-2xl border border-[var(--admin-border)] p-5 shadow-sm flex flex-col md:flex-row gap-5 group/tpl transition hover:border-stone-300 dark:hover:border-stone-600">
    <div class="flex-1 flex flex-col justify-between space-y-4">
        <div class="space-y-2">
            <div class="flex items-start justify-between">
                <div>
                    <div class="flex items-center space-x-2">
                        <h4 class="text-sm font-bold text-stone-900 dark:text-white">{{title}}</h4>
                        <span class="bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-400 px-2 py-0.5 rounded text-[10px] font-bold font-mono">{{pages.badge_template}}</span>
                    </div>
                    <p class="text-xs text-stone-400 font-mono mt-0.5">/{{slug}}</p>
                </div>
            </div>
            <p class="text-xs text-stone-600 dark:text-stone-300 leading-relaxed">{{summary}}</p>
        </div>

        <div class="pt-2 flex items-center space-x-2">
                <button
                    type="button"
                    onclick="window.openCloneTemplatePageModal && window.openCloneTemplatePageModal('{{id}}', '{{safe_title}}', '{{slug}}', '{{safe_summary}}')"
                    class="h-8 px-3 rounded-lg bg-[var(--admin-accent-soft)] hover:bg-[var(--admin-accent-border)]/40 text-[var(--admin-accent-text)] border border-[var(--admin-accent-border)] text-xs font-semibold transition flex items-center space-x-1.5 cursor-pointer"
                    title="{{themes.clone_page_tip}}"
                >
                    <span class="material-symbols-outlined text-[15px]">content_copy</span>
                    <span>{{themes.clone_page_btn}}</span>
                </button>
        </div>
    </div>

    <div class="theme-preview-viewport theme-template-viewport w-full md:w-80 aspect-[16/10] rounded-xl border border-[var(--admin-border)] bg-white dark:bg-stone-950 overflow-hidden relative shrink-0 shadow-inner">
        <div class="w-[1280px] h-[800px] overflow-hidden pointer-events-none select-none origin-top-left" style="width: 1280px; height: 800px; transform: scale(var(--preview-scale, 0.25)); transform-origin: 0 0;">
            <iframe
                srcdoc="{{safe_template_srcdoc}}"
                class="w-[1280px] h-[2400px] border-0 pointer-events-none select-none transition-transform duration-[4500ms] ease-in-out group-hover/tpl:-translate-y-[1600px]"
                loading="lazy"
                tabindex="-1"
            ></iframe>
        </div>
    </div>
</div>
