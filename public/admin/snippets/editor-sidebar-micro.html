<div class="flex flex-col h-full justify-between overflow-hidden">
    <div class="shrink-0 bg-[var(--admin-chrome)] border-b border-[var(--admin-border)] p-1.5 grid grid-cols-2 gap-1 select-none" id="editor-inspector-tabs">
        <button
            type="button"
            id="inspector-tab-props"
            data-tab="props"
            onclick="window.switchInspectorTab && window.switchInspectorTab('props')"
            class="py-1.5 px-2 rounded-md text-xs font-bold transition-colors cursor-pointer bg-[var(--admin-surface)] text-[var(--admin-text)] shadow-sm border border-[var(--admin-border)]"
        >{{tab_props}}</button>
        <button
            type="button"
            id="inspector-tab-versions"
            data-tab="versions"
            onclick="window.switchInspectorTab && window.switchInspectorTab('versions')"
            class="py-1.5 px-2 rounded-md text-xs font-bold transition-colors cursor-pointer text-[var(--admin-text-muted)] hover:text-[#1C1917] dark:hover:text-white border border-transparent"
        >{{tab_versions}}</button>
    </div>

    <div id="editor-inspector-scroll" class="p-4 text-[13px] overflow-y-auto flex-1 no-scrollbar [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
        <div id="inspector-panel-props" class="space-y-4">
        <div class="grid grid-cols-2 gap-2.5">
            <div class="space-y-1.5 min-w-0">
                <label class="block font-bold text-[var(--admin-text)] text-[11px] truncate">{{field_status}}</label>
                <edge-select
                    class="w-full h-8 bg-[var(--admin-surface)] text-[var(--admin-text)] border border-[var(--admin-border)] rounded-lg px-2.5 text-[13px] font-medium"
                    name="status"
                    value="{{node_status}}"
                    onchange="document.getElementById('form-status-input').value = this.value"
                >
                    <option value="published" {{status_published_selected}}>{{common.status_published}}</option>
                    <option value="draft" {{status_draft_selected}}>{{common.status_draft}}</option>
                </edge-select>
            </div>

            <div class="space-y-1.5 min-w-0">
                <label class="block font-bold text-[var(--admin-text)] text-[11px] truncate">{{common.field_visibility}}</label>
                <edge-select
                    class="w-full h-8 bg-[var(--admin-surface)] text-[var(--admin-text)] border border-[var(--admin-border)] rounded-lg px-2.5 text-[13px] font-medium"
                    name="visibility"
                    value="{{node_visibility}}"
                    onchange="const visInput = document.getElementById('form-visibility-input'); if (visInput) visInput.value = this.value;"
                >
                    <option value="public" {{vis_public_selected}}>{{common.vis_public}}</option>
                    {{slot_micro_api_only_option}}
                    <option value="private" {{vis_private_selected}}>{{common.vis_private}}</option>
                </edge-select>
            </div>
        </div>

        <div class="space-y-1.5">
            <label class="block font-bold text-[var(--admin-text)] text-[11px]">{{field_locale}}</label>
            <edge-select
                class="w-full h-8 bg-[var(--admin-surface)] text-[var(--admin-text)] border border-[var(--admin-border)] rounded-lg px-2.5 text-[13px] font-medium"
                name="locale"
                value="{{current_locale}}"
                onchange="const locInput = document.getElementById('form-locale-input'); if (locInput) locInput.value = this.value;"
            >
                {{locale_options_html}}
            </edge-select>
        </div>

        <div class="space-y-1.5">
            <label class="block font-bold text-[var(--admin-text)] text-[11px]">{{field_published_at}}</label>
            <input
                type="datetime-local"
                name="published_at"
                value="{{published_at_input}}"
                class="w-full h-8 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-2.5 text-[12px] font-mono text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)]"
            />
        </div>

        <div class="space-y-1.5">
            <div class="flex justify-between items-center">
                <label class="font-bold text-[var(--admin-text)] text-[11px]">{{field_progress}}</label>
                <span class="text-[10px] text-[var(--admin-text-muted)] font-mono">{{progress_badge}}</span>
            </div>
            <input
                type="text"
                id="progress-input-field"
                name="progress"
                value="{{current_progress}}"
                placeholder="{{progress_placeholder}}"
                oninput="const val = this.value; const matInput = document.getElementById('form-maturity-input'); if (matInput) matInput.value = val; const progInput = document.getElementById('form-progress-input'); if (progInput) progInput.value = val;"
                class="w-full h-8 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-2.5 text-[13px] text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)]"
            />
        </div>

        <div class="space-y-1.5">
            <label class="block font-bold text-[var(--admin-text)] text-[11px]">{{field_folder}}</label>
            <input
                type="text"
                name="meta_folder"
                value="{{node_folder}}"
                placeholder="{{micro.catalog_placeholder}}"
                class="w-full h-8 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-2.5 text-[13px] text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)] font-medium"
            />
        </div>

        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label class="font-bold text-[var(--admin-text)] text-[11px]">{{field_tags}}</label>
                <span class="text-[10px] text-[var(--admin-text-muted)] font-mono">{{tag_tip}}</span>
            </div>
            <div id="tag-chips-container" class="flex flex-wrap gap-1.5 min-h-[1.5rem]">
                {{tag_chips_html}}
            </div>
            <input
                type="text"
                id="tag-input-field"
                placeholder="{{tags_input_placeholder}}"
                onkeydown="window.handleTagInputKey(event)"
                class="w-full h-8 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-2.5 text-[13px] text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)]"
            />
        </div>
        </div>

        <div id="inspector-panel-versions" class="hidden space-y-4">
            <div class="space-y-1.5">
                <label class="block font-bold text-[var(--admin-text)] text-[11px]">{{field_commit}}</label>
                <input
                    type="text"
                    name="commit_message"
                    placeholder="{{field_commit_placeholder}}"
                    class="w-full h-8 bg-[var(--admin-surface)] border border-[var(--admin-border)] rounded-lg px-2.5 text-[13px] text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)]"
                />
            </div>

            <div class="pt-3 border-t border-[var(--admin-border)] space-y-2">
                <div class="flex items-center justify-between">
                    <label class="font-bold text-[var(--admin-text)] text-[11px]">{{versions_title}}</label>
                    <span id="vcs-versions-count" class="text-[11px] font-mono text-[#78716C] font-bold">{{versions_count}}</span>
                </div>
                <div id="vcs-versions-list" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                    {{past_versions_html}}
                </div>
            </div>

            <div class="pt-4 mt-4 border-t border-[var(--admin-border)]">
                <button
                    type="button"
                    onclick="confirmSoftDeleteArticle()"
                    class="w-full text-red-600/80 dark:text-red-400/80 hover:text-red-700 dark:hover:text-red-300 hover:bg-red-50/70 dark:hover:bg-red-950/30 font-semibold text-xs py-2 px-3 rounded-lg transition-colors duration-75 flex items-center justify-center space-x-1.5 cursor-pointer {{soft_delete_btn_class}}"
                    title="{{btn_trash_item}}"
                >
                    <span class="material-symbols-outlined text-[15px]">delete</span>
                    <span>{{btn_trash_item}}</span>
                </button>
            </div>
        </div>
    </div>

    <div class="p-4 border-t border-[var(--admin-border)] bg-[var(--admin-chrome)] shrink-0 {{convert_article_class}}">
        <button
            type="button"
            onclick="window.convertMicroToArticle && window.convertMicroToArticle('{{node_id}}')"
            class="w-full h-8 px-3 rounded-lg bg-[var(--admin-accent-soft)] hover:bg-[var(--admin-accent-border)]/40 text-[var(--admin-accent-text)] border border-[var(--admin-accent-border)] text-xs font-semibold transition flex items-center justify-center space-x-1.5 cursor-pointer"
        >
            <span class="material-symbols-outlined text-[15px]">article</span>
            <span>{{btn_convert_to_article}}</span>
        </button>
    </div>
</div>
