<div
    onclick="document.getElementById('site-switcher-input').value='{{site_id}}';document.getElementById('site-switcher-form').submit();"
    class="px-2.5 py-1.5 hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text)] cursor-pointer flex items-center justify-between {{active_class}}"
>
    <span class="inline-flex items-center space-x-1.5 truncate font-medium"><span class="material-symbols-outlined text-[14px] text-[var(--admin-text-muted)] shrink-0">language</span><span class="truncate">{{site_name}}</span></span>
    <span class="text-[10px] text-[var(--admin-text-muted)] font-mono ml-1 shrink-0">{{primary_domain}}</span>
</div>
