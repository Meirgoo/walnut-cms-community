<div
    id="media-card-{{id}}"
    class="media-card-item group bg-white dark:bg-slate-800 rounded-xl border border-slate-200/80 dark:border-slate-700 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between relative cursor-pointer"
    onclick="openMediaModal({{asset_json}})"
>
    <div class="absolute top-2 left-2 z-10" onclick="event.stopPropagation()">
        <input
            type="checkbox"
            class="media-select-box w-4 h-4 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600 dark:accent-emerald-500"
            data-id="{{id}}"
            data-url="{{public_url}}"
            data-name="{{file_name}}"
            onchange="updateBatchState()"
        />
    </div>

    <div class="h-36 bg-slate-100 dark:bg-slate-900 flex items-center justify-center overflow-hidden relative">
        {{thumb_content}}
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center space-x-2">
            <span class="text-white text-xs font-bold bg-black/50 px-2 py-1 rounded">{{click_to_zoom}}</span>
        </div>
    </div>

    <div class="p-2.5">
        <div class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate" title="{{file_name}}">{{file_name}}</div>
        <div class="flex justify-between items-center mt-1 text-[10px] text-slate-400 font-mono">
            <span>{{file_size_formatted}}</span>
            <span class="uppercase">{{file_ext}}</span>
        </div>
    </div>
</div>
