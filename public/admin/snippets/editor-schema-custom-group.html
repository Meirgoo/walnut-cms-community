<div id="schema-fields-{{safe_slug}}" data-schema-id="{{id}}" class="schema-fields-group {{selected_class}} space-y-1.5 bg-[var(--admin-surface)] p-2 rounded-lg border border-[var(--admin-border)]">
    <div class="flex items-center justify-between gap-1.5">
        <span class="text-[10px] font-bold text-[var(--admin-accent-text)] font-mono truncate">{{title}} ({{slug}})</span>
        <button type="button" onclick="deleteSchemaModel('{{id}}', '{{title}}')" class="{{delete_btn_class}} text-[var(--admin-text-muted)] hover:text-red-500 transition items-center justify-center w-5 h-5 rounded shrink-0 cursor-pointer" title="{{btn_delete_schema}}">
            <span class="material-symbols-outlined text-[14px] leading-none">delete</span>
        </button>
    </div>
    {{fields_html}}
</div>
