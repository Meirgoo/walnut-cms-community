<div id="schema-fields-{{safe_slug}}" data-schema-id="{{id}}" class="schema-fields-group {{selected_class}} space-y-2 bg-slate-50 dark:bg-slate-950 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
    <div class="flex items-center justify-between">
        <div class="text-[10px] font-bold text-purple-600 dark:text-purple-400 font-mono">{{title}} ({{slug}})</div>
        <button type="button" onclick="window.deleteSchemaModel('{{id}}', '{{title}}')" class="text-[11px] text-red-500 hover:text-red-400 flex items-center space-x-0.5 cursor-pointer" title="{{btn_delete_schema}}">
            <span class="material-symbols-outlined text-[13px]">delete</span><span>{{btn_delete_schema}}</span>
        </button>
    </div>
    {{fields_html}}
</div>
