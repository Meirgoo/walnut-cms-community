<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-5 shadow-sm space-y-4">
    <div class="flex justify-between items-start">
        <div>
            <div class="flex items-center space-x-2">
                <h4 class="text-sm font-bold text-slate-900 dark:text-white font-mono">{{key}}</h4>
                <span class="bg-purple-50 dark:bg-purple-950 text-purple-700 dark:text-purple-400 px-2 py-0.5 rounded text-[10px] font-bold font-mono">{{themes.badge_md_component}}</span>
            </div>
            <p class="text-xs text-slate-400 font-mono mt-0.5">{{syntax_prefix}}<code class="text-emerald-600 font-bold">[[{{key}}: ...]]</code></p>
        </div>


    </div>
    <div class="space-y-1.5">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">{{live_preview}}</div>
        <div class="bg-slate-100 dark:bg-slate-950/80 p-2.5 rounded-xl border border-slate-200/80 dark:border-slate-800/80">
            <div class="theme-preview-viewport theme-component-viewport w-full rounded-lg shadow-sm ring-1 ring-black/5 dark:ring-white/10 overflow-hidden relative bg-white dark:bg-slate-900 transition-[height] duration-200" style="min-height: 56px; height: 96px;">
                <iframe
                    srcdoc="{{safe_md_srcdoc}}"
                    class="pointer-events-none select-none border-0 origin-top-left absolute top-0 left-0"
                    style="width: 960px; transform: scale(var(--preview-scale, 0.4)); transform-origin: 0 0;"
                    loading="lazy"
                    tabindex="-1"
                    onload="window.adaptThemeComponentHeight && window.adaptThemeComponentHeight(this)"
                ></iframe>
            </div>
        </div>
    </div>
</div>
