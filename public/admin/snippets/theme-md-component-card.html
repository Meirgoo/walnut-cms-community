<div class="bg-[var(--admin-surface)] rounded-2xl border border-[var(--admin-border)] p-5 shadow-sm space-y-3.5">
    <div class="flex justify-between items-start">
        <div>
            <div class="flex items-center space-x-2">
                <h4 class="text-sm font-bold text-[var(--admin-text)] font-mono">{{key}}</h4>
                <span class="list-pill list-pill-draft">{{themes.badge_md_component}}</span>
            </div>
            <p class="text-xs text-[var(--admin-text-muted)] font-mono mt-0.5">{{syntax_prefix}}<code class="text-[var(--admin-accent-text)] font-semibold">[[{{key}}: ...]]</code></p>
        </div>
    </div>
    <div class="space-y-1.5">
        <div class="text-[10px] font-semibold text-[var(--admin-text-muted)] uppercase tracking-wider">{{live_preview}}</div>
        <div class="theme-preview-viewport theme-component-viewport w-full rounded-lg border border-[var(--admin-border)] overflow-hidden relative bg-[var(--admin-canvas)] transition-[height] duration-200" style="min-height: 56px; height: 96px;">
            <iframe
                srcdoc="{{safe_md_srcdoc}}"
                class="pointer-events-none select-none border-0 origin-top-left absolute top-0 left-0"
                style="width: 960px; transform: scale(var(--preview-scale, 0.4)); transform-origin: 0 0;"
                loading="lazy"
                tabindex="-1"
                onload="window.adaptThemeComponentHeight && window.adaptThemeComponentHeight(this)"
            ></iframe>
        </div>
    </div>
</div>
