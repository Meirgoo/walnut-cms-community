<div class="dashboard-timeline-item dashboard-feed-row relative pl-5 pb-3.5 last:pb-0 group" data-category="{{item_category}}" data-feed-module="{{item_module}}">
    <span class="absolute left-0 top-1.5 w-2 h-2 rounded-full {{node_dot_class}} ring-4 ring-[var(--admin-surface)]"></span>
    <div class="flex items-center justify-between gap-2 min-w-0">
        <div class="flex items-center gap-2 min-w-0 flex-1">
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold leading-none shrink-0 {{badge_class}}">
                <span class="material-symbols-outlined text-[11px] leading-none">{{type_icon}}</span>
                <span>{{type_label}}</span>
            </span>
            <a href="{{target_url}}" class="text-[13px] font-semibold text-[var(--admin-text)] hover:text-[var(--admin-accent-text)] truncate min-w-0 transition-colors">
                {{title}}
            </a>
            <span class="text-[11px] text-[var(--admin-text-muted)] font-mono truncate max-w-[140px] hidden sm:inline">{{slug_display}}</span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <span class="text-[11px] text-[var(--admin-text-muted)] font-mono hidden md:inline cursor-default" title="{{time_full}}">{{time_short}}</span>
            <a href="{{target_url}}" class="w-6 h-6 rounded-md inline-flex items-center justify-center text-[var(--admin-text-muted)] hover:text-[var(--admin-accent-text)] hover:bg-[var(--admin-surface-hover)] transition-colors" title="{{action_tip}}">
                <span class="material-symbols-outlined text-[15px] leading-none">arrow_forward</span>
            </a>
        </div>
    </div>
</div>
