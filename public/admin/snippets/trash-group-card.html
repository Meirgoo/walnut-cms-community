<div id="trash-group-{{node_id}}" class="trash-group-card bg-[var(--admin-surface)] rounded-2xl border border-[var(--admin-border)] shadow-sm overflow-hidden transition">
    <div class="p-5 flex items-center justify-between bg-stone-50/70 dark:bg-stone-900/60 border-b border-stone-100 dark:border-stone-700">
        <div class="flex items-center space-x-3 flex-1 min-w-0 pr-4">
            <input
                type="checkbox"
                class="trash-group-checkbox w-4 h-4 rounded border-stone-300 dark:border-stone-600 bg-[var(--admin-surface)] text-amber-600 focus:ring-amber-500 cursor-pointer accent-amber-600 dark:accent-amber-500"
                data-node-id="{{node_id}}"
                onchange="updateTrashGroupBatchState()"
            />

            <button
                type="button"
                onclick="toggleVersionAccordion('{{node_id}}')"
                class="flex items-center space-x-2 text-left flex-1 min-w-0 cursor-pointer group"
            >
                <span id="arrow-icon-{{node_id}}" class="material-symbols-outlined text-stone-400 text-[20px] transition-transform duration-200">
                    expand_more
                </span>
                <div>
                    <div class="font-bold text-stone-900 dark:text-white group-hover:text-amber-700 dark:group-hover:text-amber-400 text-sm truncate flex items-center space-x-2">
                        <span>{{title}}</span>
                        <span class="bg-stone-200 dark:bg-stone-700 text-stone-700 dark:text-stone-200 text-[10px] font-mono px-2 py-0.2 rounded font-bold uppercase">
                            {{type}} · {{snapshots_count_text}}
                        </span>
                    </div>
                    <div class="text-[11px] text-stone-400 font-mono truncate mt-0.5">
                        /{{slug}}{{deleted_time_prefix}}{{deleted_at_formatted}}
                    </div>
                </div>
            </button>
        </div>

        <div class="flex items-center space-x-3 shrink-0">
            <button
                type="button"
                hx-post="/admin/trash/api/restore/{{node_id}}"
                hx-swap="none"
                hx-confirm="{{confirm_restore}}"
                class="bg-amber-50 dark:bg-amber-950 hover:bg-amber-100 dark:hover:bg-amber-900 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[14px]">restore_from_trash</span>
                <span>{{btn_restore}}</span>
            </button>
            <button
                type="button"
                hx-delete="/admin/trash/api/hard-delete/{{node_id}}"
                hx-target="#trash-group-{{node_id}}"
                hx-swap="outerHTML"
                hx-confirm="{{confirm_hard_delete}}"
                class="bg-red-50 dark:bg-red-950 hover:bg-red-100 dark:hover:bg-red-900 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[14px]">delete_forever</span>
                <span>{{btn_hard_delete}}</span>
            </button>
        </div>
    </div>

    <div id="versions-box-{{node_id}}" class="hidden divide-y divide-stone-100 dark:divide-stone-700/60 bg-[var(--admin-surface)]">
        {{versions_html}}
    </div>
</div>
