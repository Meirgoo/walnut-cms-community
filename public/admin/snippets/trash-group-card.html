<div id="trash-group-{{node_id}}" class="trash-group-card bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm overflow-hidden transition">
    <div class="p-5 flex items-center justify-between bg-slate-50/70 dark:bg-slate-900/60 border-b border-slate-100 dark:border-slate-700">
        <div class="flex items-center space-x-3 flex-1 min-w-0 pr-4">
            <input
                type="checkbox"
                class="trash-group-checkbox w-4 h-4 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-emerald-600 focus:ring-emerald-500 cursor-pointer accent-emerald-600 dark:accent-emerald-500"
                data-node-id="{{node_id}}"
                onchange="updateTrashGroupBatchState()"
            />

            <button
                type="button"
                onclick="toggleVersionAccordion('{{node_id}}')"
                class="flex items-center space-x-2 text-left flex-1 min-w-0 cursor-pointer group"
            >
                <span id="arrow-icon-{{node_id}}" class="material-symbols-outlined text-slate-400 text-[20px] transition-transform duration-200">
                    expand_more
                </span>
                <div>
                    <div class="font-bold text-slate-900 dark:text-white group-hover:text-emerald-700 dark:group-hover:text-emerald-400 text-sm truncate flex items-center space-x-2">
                        <span>{{title}}</span>
                        <span class="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-[10px] font-mono px-2 py-0.2 rounded font-bold uppercase">
                            {{type}} · {{snapshots_count_text}}
                        </span>
                    </div>
                    <div class="text-[11px] text-slate-400 font-mono truncate mt-0.5">
                        /{{slug}}{{deleted_time_prefix}}{{deleted_at_formatted}}
                    </div>
                </div>
            </button>
        </div>

        <div class="flex items-center space-x-3 shrink-0">
            <button
                type="button"
                hx-post="/admin/trash/api/restore/{{node_id}}"
                hx-swap="none"
                hx-confirm="{{confirm_restore}}"
                class="bg-emerald-50 dark:bg-emerald-950 hover:bg-emerald-100 dark:hover:bg-emerald-900 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[14px]">restore_from_trash</span>
                <span>{{btn_restore}}</span>
            </button>
            <button
                type="button"
                hx-delete="/admin/trash/api/hard-delete/{{node_id}}"
                hx-target="#trash-group-{{node_id}}"
                hx-swap="outerHTML"
                hx-confirm="{{confirm_hard_delete}}"
                class="bg-red-50 dark:bg-red-950 hover:bg-red-100 dark:hover:bg-red-900 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[14px]">delete_forever</span>
                <span>{{btn_hard_delete}}</span>
            </button>
        </div>
    </div>

    <div id="versions-box-{{node_id}}" class="hidden divide-y divide-slate-100 dark:divide-slate-700/60 bg-white dark:bg-slate-800">
        {{versions_html}}
    </div>
</div>
