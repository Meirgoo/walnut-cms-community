<tr class="h-11 hover:bg-stone-50/80 dark:hover:bg-stone-700/30 transition-colors duration-75 ease-out dataset-row" data-id="{{id}}" data-schema="{{schema_slug}}" data-slug="{{collection_slug}}">
    <td class="px-4 py-2 text-center">
        <input type="checkbox" class="dataset-select-box w-4 h-4 rounded border-stone-300 dark:border-stone-600 bg-[var(--admin-surface)] text-amber-600 focus:ring-amber-500 cursor-pointer accent-amber-600 dark:accent-amber-500" data-id="{{id}}" data-count="{{item_count}}" data-name="{{collection_name}}" onchange="window.updateDatasetBatchState && window.updateDatasetBatchState()" />
    </td>
    <td class="px-6 py-2 font-bold text-[var(--admin-text)] text-left">
        <div class="flex items-center space-x-2 min-w-0 max-w-[340px] xl:max-w-[460px]">
            <a href="/admin/datasets/collection/{{id}}" class="hover:text-[var(--admin-accent-text)] transition-colors duration-75 ease-out truncate" title="{{collection_name}}">{{collection_name}}</a>
            <span class="text-[11px] font-mono font-normal text-[var(--admin-text-muted)] bg-[var(--admin-chrome)] px-1.5 py-0.5 rounded shrink-0">{{collection_slug}}</span>
        </div>
    </td>
    <td class="px-6 py-2 text-center hidden font-mono text-xs text-[var(--admin-text-muted)] whitespace-nowrap" data-col="schema_slug">{{collection_slug}}</td>
    <td class="px-6 py-2 text-center whitespace-nowrap">
        <span class="list-pill list-pill-locale list-pill-truncate" title="{{schema_title}}">
            {{schema_title}}
        </span>
    </td>
    <td class="px-6 py-2 text-center font-mono text-xs whitespace-nowrap">
        <span class="list-pill list-pill-draft">{{item_count_label}}</span>
    </td>
    <td class="px-6 py-2 text-center hidden font-mono text-xs text-[var(--admin-text-muted)] whitespace-nowrap" data-col="ref_pages">{{ref_pages_count}}</td>
    <td class="px-6 py-2 text-center hidden text-xs text-[var(--admin-text-muted)] whitespace-nowrap" data-col="created" title="{{created_at_full}}">{{created_at_formatted}}</td>
    <td class="px-6 py-2 text-center text-xs text-[var(--admin-text-muted)] whitespace-nowrap" title="{{updated_at_full}}">
        {{updated_at_formatted}}
    </td>
    <td class="px-6 py-2 text-center space-x-2 whitespace-nowrap">
        <a href="/admin/datasets/collection/{{id}}" class="text-xs font-medium text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] transition">{{btn_manage_items}}</a>
        <a href="/admin/datasets/api/export-collection/{{id}}" download="{{collection_slug}}.json" class="text-xs font-medium text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] transition">{{btn_export_json}}</a>
        <button
            type="button"
            onclick="window.deleteDatasetCollection && window.deleteDatasetCollection('{{id}}', '{{collection_name_js}}', {{item_count}})"
            title="{{common.delete}}"
            class="p-1 rounded-md list-action-trash cursor-pointer inline-flex items-center justify-center align-middle"
        >
            <span class="material-symbols-outlined text-[16px]">delete</span>
        </button>
    </td>
</tr>
