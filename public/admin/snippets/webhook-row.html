<tr class="hover:bg-stone-50/60 dark:hover:bg-stone-800/40 transition">
    <td class="px-5 py-3.5">
        <div class="font-bold text-stone-800 dark:text-stone-100">{{name}}</div>
        <div class="text-[11px] text-stone-400 font-mono mt-0.5">ID: {{form_id}}</div>
    </td>
    <td class="px-5 py-3.5">
        <div class="inline-flex items-center space-x-1.5 bg-stone-100 dark:bg-stone-800 px-2 py-1 rounded-md font-mono text-[11px] text-stone-600 dark:text-stone-300">
            <span>/api/forms/submit/{{form_id}}</span>
            <button
                type="button"
                onclick="window.copyToClipboard ? window.copyToClipboard('/api/forms/submit/{{form_id}}') : copyText('/api/forms/submit/{{form_id}}')"
                class="hover:text-amber-500 cursor-pointer"
                title="{{webhooks.tip_copy_endpoint}}"
            >
                <span class="material-symbols-outlined text-[14px]">content_copy</span>
            </button>
        </div>
    </td>
    <td class="px-5 py-3.5">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold {{platform_badge_class}}">
            {{platform_label}}
        </span>
    </td>
    <td class="px-5 py-3.5 max-w-xs truncate" title="{{form_webhook_url}}">
        <span class="font-mono text-[11px] text-stone-500 dark:text-stone-400">{{form_webhook_url}}</span>
    </td>
    <td class="px-5 py-3.5">
        {{secret_badge_html}}
    </td>
    <td class="px-5 py-3.5">
        {{status_badge_html}}
    </td>
    <td class="px-5 py-3.5 text-right space-x-2">
        <button
            type="button"
            onclick="testWebhookDispatch('{{id}}')"
            class="px-2.5 py-1 rounded-lg text-[11px] font-bold text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-800 transition cursor-pointer"
            title="{{webhooks.tip_test_webhook}}"
        >
            <span class="material-symbols-outlined text-[14px] align-middle mr-0.5">send</span>{{webhooks.test_btn}}
        </button>
        <button
            type="button"
            onclick="openWebhookModal({{config_json}})"
            class="px-2.5 py-1 rounded-lg text-[11px] font-bold text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/50 transition cursor-pointer"
        >
            {{common.edit}}
        </button>
        <button
            type="button"
            onclick="deleteWebhookRule('{{id}}', '{{name}}')"
            class="px-2.5 py-1 rounded-lg text-[11px] font-bold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/50 transition cursor-pointer"
        >
            {{common.delete}}
        </button>
    </td>
</tr>
