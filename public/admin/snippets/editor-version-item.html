<div id="version-card-{{id}}" class="p-3 rounded-xl bg-stone-50 dark:bg-stone-950 border border-stone-200/70 dark:border-stone-800 text-xs space-y-1.5 hover:border-stone-300 dark:hover:border-stone-700 transition">
    <div class="flex justify-between items-center font-mono">
        <span class="font-bold text-stone-900 dark:text-white">{{version_tag}}</span>
        <span class="text-[10px] text-stone-400">{{created_at}}</span>
    </div>
    <div class="text-stone-600 dark:text-stone-400 truncate text-[11px]">{{commit_message}}</div>
    <div class="flex justify-between items-center pt-1.5 border-t border-stone-200/50 dark:border-stone-800">
        <button type="button" onclick="window.inspectVersionById('{{id}}', {{version_number}})" class="text-blue-600 dark:text-blue-400 hover:underline font-bold text-[11px] cursor-pointer">{{btn_inspect}}</button>
        <div class="flex items-center space-x-2">
            <button type="button" onclick="window.rollbackToVersionById('{{id}}', {{version_number}})" class="text-amber-700 dark:text-amber-400 hover:underline font-bold text-[11px] cursor-pointer">{{btn_rollback}}</button>
            <button type="button" onclick="window.deletePastVersion('{{id}}', {{version_number}})" class="text-red-500 hover:text-red-700 inline-flex items-center justify-center p-0.5 rounded transition cursor-pointer" title="{{delete_label}}"><span class="material-symbols-outlined text-[14px]">delete</span></button>
        </div>
    </div>
</div>
