<div id="snapshot-preview-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-3xl w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4 max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
            <h3 id="snapshot-modal-title" class="text-base font-bold text-slate-900 dark:text-white">{{preview_modal_title}}</h3>
            <button type="button" onclick="closeSnapshotPreview()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white cursor-pointer">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <div id="snapshot-modal-content" class="flex-1 overflow-y-auto text-xs leading-relaxed text-slate-800 dark:text-slate-200 prose dark:prose-invert max-w-none p-4 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200/80 dark:border-slate-800 font-mono"></div>

        <div class="flex justify-end pt-2 border-t border-slate-100 dark:border-slate-700">
            <button type="button" onclick="closeSnapshotPreview()" class="bg-slate-900 hover:bg-black dark:bg-slate-700 dark:hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm cursor-pointer">{{cancel}}</button>
        </div>
    </div>
</div>
