<div id="snapshot-preview-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--admin-surface)] rounded-2xl max-w-3xl w-full p-6 shadow-2xl border border-[var(--admin-border)] space-y-4 max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center border-b border-[var(--admin-border)] pb-3">
            <h3 id="snapshot-modal-title" class="text-base font-bold text-[var(--admin-text)]">{{preview_modal_title}}</h3>
            <button type="button" onclick="closeSnapshotPreview()" class="text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] cursor-pointer">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <div id="snapshot-modal-content" class="flex-1 overflow-y-auto text-xs leading-relaxed text-[var(--admin-text)] prose dark:prose-invert max-w-none p-4 bg-[var(--admin-canvas)] rounded-lg border border-[var(--admin-border)] font-mono"></div>

        <div class="flex justify-end pt-2 border-t border-[var(--admin-border)]">
            <button type="button" onclick="closeSnapshotPreview()" class="h-8 px-4 rounded-lg text-xs font-semibold bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text)] border border-[var(--admin-border)] cursor-pointer">{{cancel}}</button>
        </div>
    </div>
</div>
