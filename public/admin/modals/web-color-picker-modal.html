<div id="web-color-picker-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--admin-surface)] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[var(--admin-border)] space-y-5">
        <div class="flex justify-between items-center border-b border-stone-100 dark:border-stone-700 pb-3">
            <div class="flex items-center space-x-2">
                <span class="material-symbols-outlined text-amber-600 dark:text-amber-400 text-[20px]">palette</span>
                <h3 class="text-sm font-bold text-stone-900 dark:text-white">{{color_picker_title}}</h3>
            </div>
            <button type="button" onclick="window.closeWebColorPickerModal()" class="text-stone-400 hover:text-stone-700 dark:hover:text-white cursor-pointer">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <div class="flex items-center space-x-3 bg-stone-50 dark:bg-stone-950 p-3 rounded-xl border border-[var(--admin-border)]">
            <div id="web-color-preview-swatch" class="w-12 h-12 rounded-xl shadow-md border border-black/10 shrink-0 transition-colors" style="background-color: {{brand_color}};"></div>
            <div class="flex-1 space-y-1">
                <label class="block text-[10px] font-bold text-stone-400 uppercase tracking-wider">{{color_picker_hex}}</label>
                <input
                    type="text"
                    id="web-color-hex-input"
                    value="{{brand_color}}"
                    oninput="window.selectColorFromPalette(this.value)"
                    placeholder="#10b981"
                    class="w-full bg-white dark:bg-stone-900 border border-stone-300 dark:border-stone-700 rounded-lg px-2.5 py-1.5 text-xs font-mono font-bold text-stone-900 dark:text-white outline-none focus:border-amber-500"
                />
            </div>
        </div>

        <div class="space-y-1.5">
            <div class="text-[11px] font-bold text-stone-500 dark:text-stone-400">{{color_picker_palette}}</div>
            <div id="web-color-palette-container" class="grid grid-cols-8 gap-2 p-3 bg-stone-50 dark:bg-stone-950 rounded-xl border border-[var(--admin-border)] max-h-56 overflow-y-auto"></div>
        </div>

        <div class="flex justify-end space-x-2 pt-2 border-t border-stone-100 dark:border-stone-700">
            <button type="button" onclick="window.closeWebColorPickerModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-700 cursor-pointer">{{cancel}}</button>
            <button type="button" onclick="window.applySelectedWebColor()" class="bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] px-5 py-2 rounded-xl text-xs font-bold shadow-sm cursor-pointer">{{color_picker_apply}}</button>
        </div>
    </div>
</div>
