<div id="webhook-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/60 backdrop-blur-sm">
    <div class="bg-[var(--admin-surface)] rounded-2xl border border-[var(--admin-border)] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
        <div class="px-6 py-4 border-b border-[var(--admin-border)] flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="material-symbols-outlined text-[var(--admin-text-muted)]">webhook</span>
                <h3 id="webhook-modal-title" class="text-base font-bold text-[var(--admin-text)]">{{webhooks.modal_title_new}}</h3>
            </div>
            <button
                type="button"
                onclick="closeWebhookModal()"
                class="text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] transition cursor-pointer"
            >
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <form id="webhook-form" onsubmit="handleWebhookFormSubmit(event)" class="p-6 space-y-4 text-xs">
            <input type="hidden" id="wh-input-id" name="id" value="" />

            <div>
                <label class="block font-semibold text-[var(--admin-text-muted)] mb-1">
                    {{webhooks.field_rule_name}} <span class="text-[var(--admin-danger)]">*</span>
                </label>
                <input
                    type="text"
                    id="wh-input-name"
                    name="name"
                    required
                    placeholder="{{webhooks.field_rule_name_ph}}"
                    class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-3 text-[var(--admin-text)] focus:outline-none focus:border-[var(--admin-accent)]"
                />
            </div>

            <div>
                <label class="block font-semibold text-[var(--admin-text-muted)] mb-1">
                    {{webhooks.field_form_id}} <span class="text-[var(--admin-danger)]">*</span>
                </label>
                <input
                    type="text"
                    id="wh-input-form-id"
                    name="form_id"
                    required
                    pattern="[A-Za-z0-9_-]+"
                    placeholder="{{webhooks.field_form_id_ph}}"
                    class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-3 font-mono text-[var(--admin-text)] focus:outline-none focus:border-[var(--admin-accent)]"
                />
                <p class="text-[11px] text-[var(--admin-text-muted)] mt-1">
                    /api/forms/submit/<span id="wh-preview-form-id">contact-us</span>
                </p>
            </div>

            <div>
                <label class="block font-semibold text-[var(--admin-text-muted)] mb-1">
                    {{webhooks.field_target_url}} <span class="text-[var(--admin-danger)]">*</span>
                </label>
                <input
                    type="url"
                    id="wh-input-url"
                    name="form_webhook_url"
                    required
                    placeholder="{{webhooks.field_target_url_ph}}"
                    class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-3 font-mono text-[var(--admin-text)] focus:outline-none focus:border-[var(--admin-accent)]"
                />
                <div class="mt-1.5 flex flex-wrap gap-1.5 text-[10px]">
                    <span class="bg-[var(--admin-chrome)] text-[var(--admin-text-muted)] px-1.5 py-0.5 rounded border border-[var(--admin-border)]">{{webhooks.platform_feishu}}</span>
                    <span class="bg-[var(--admin-chrome)] text-[var(--admin-text-muted)] px-1.5 py-0.5 rounded border border-[var(--admin-border)]">{{webhooks.platform_dingtalk}}</span>
                    <span class="bg-[var(--admin-chrome)] text-[var(--admin-text-muted)] px-1.5 py-0.5 rounded border border-[var(--admin-border)]">{{webhooks.platform_wechat}}</span>
                    <span class="bg-[var(--admin-chrome)] text-[var(--admin-text-muted)] px-1.5 py-0.5 rounded border border-[var(--admin-border)]">Slack/Discord</span>
                    <span class="text-[var(--admin-text-muted)] self-center">{{webhooks.auto_packaging_tip}}</span>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-[var(--admin-text-muted)] mb-1">
                    {{webhooks.field_secret}} <span class="text-[var(--admin-text-muted)] font-normal">{{webhooks.field_secret_optional}}</span>
                </label>
                <input
                    type="password"
                    id="wh-input-secret"
                    name="form_webhook_secret"
                    placeholder="{{webhooks.field_secret_ph}}"
                    class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-3 font-mono text-[var(--admin-text)] focus:outline-none focus:border-[var(--admin-accent)]"
                />
            </div>

            <div class="pt-1">
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input
                        type="checkbox"
                        id="wh-input-active"
                        name="is_active"
                        checked
                        class="w-4 h-4 rounded accent-[var(--admin-accent)] cursor-pointer"
                    />
                    <span class="font-semibold text-[var(--admin-text)]">{{webhooks.field_enable}}</span>
                </label>
            </div>

            <div class="pt-4 border-t border-[var(--admin-border)] flex items-center justify-end space-x-2">
                <button
                    type="button"
                    onclick="closeWebhookModal()"
                    class="h-8 px-3.5 rounded-lg text-xs font-semibold text-[var(--admin-text-muted)] hover:bg-[var(--admin-surface-hover)] transition cursor-pointer"
                >
                    {{common.cancel}}
                </button>
                <button
                    type="submit"
                    id="wh-submit-btn"
                    class="h-8 px-4 rounded-lg text-[13px] font-semibold bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] shadow-sm transition cursor-pointer"
                >
                    {{common.save}}
                </button>
            </div>
        </form>
    </div>
</div>
