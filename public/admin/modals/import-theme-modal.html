<div id="import-theme-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--admin-surface)] rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-[var(--admin-border)] space-y-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-[var(--admin-border)] pb-3">
            <h3 class="text-sm font-bold text-[var(--admin-text)] flex items-center space-x-1.5">
                <span class="material-symbols-outlined text-[var(--admin-accent-text)] text-[20px]">palette</span>
                <span>{{modal_import_title}}</span>
            </h3>
            <button type="button" onclick="document.getElementById('import-theme-modal').classList.add('hidden')" class="text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] cursor-pointer">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <div class="flex border-b border-[var(--admin-border)] text-xs font-semibold">
            <button
                type="button"
                id="btn-import-mode-zip"
                onclick="window.switchThemeImportMode('zip')"
                class="px-4 py-2 border-b-2 border-[var(--admin-accent)] text-[var(--admin-text)] cursor-pointer transition flex items-center space-x-1.5"
            >
                <span class="material-symbols-outlined text-[16px]">folder_zip</span>
                <span>{{modal_tab_zip_label}}</span>
            </button>
            <button
                type="button"
                id="btn-import-mode-repo"
                onclick="window.switchThemeImportMode('repo')"
                class="px-4 py-2 border-b-2 border-transparent text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] cursor-pointer transition flex items-center space-x-1.5"
            >
                <span class="material-symbols-outlined text-[16px]">link</span>
                <span>{{modal_tab_repo_label}}</span>
            </button>
        </div>

        <form id="theme-import-form" class="space-y-4" onsubmit="window.handleThemeImportSubmit(event)">
            <div>
                <label class="block text-xs font-semibold text-[var(--admin-text)] mb-1.5">{{modal_select_file}} (.zip / .json)</label>
                <div
                    id="theme-file-dropzone"
                    class="relative rounded-xl border-2 border-dashed border-[var(--admin-border)] hover:border-[var(--admin-accent)] bg-[var(--admin-canvas)] p-5 text-center transition cursor-pointer"
                >
                    <input type="file" id="theme-file-input" name="file" accept=".zip,.json,application/zip,application/x-zip-compressed,application/json" class="hidden" />
                    <div id="theme-file-empty" class="flex flex-col items-center space-y-1.5 pointer-events-none">
                        <span class="material-symbols-outlined text-[26px] text-[var(--admin-text-muted)]">cloud_upload</span>
                        <span class="text-xs font-medium text-[var(--admin-text)]">{{themes.dropzone_prompt}}</span>
                        <span class="text-[11px] text-[var(--admin-text-muted)]">{{modal_zip_tip}}</span>
                    </div>
                    <div id="theme-file-selected" class="hidden flex items-center justify-between gap-2 text-xs">
                        <div class="flex items-center space-x-2 min-w-0">
                            <span class="material-symbols-outlined text-[18px] text-[var(--admin-accent-text)] shrink-0">draft</span>
                            <span id="theme-file-name" class="font-mono font-medium text-[var(--admin-text)] truncate"></span>
                        </div>
                        <button type="button" id="theme-file-clear-btn" onclick="event.stopPropagation(); window.clearThemeImportFile && window.clearThemeImportFile();" class="h-7 px-2 rounded-md border border-[var(--admin-border)] bg-[var(--admin-surface)] hover:bg-[var(--admin-surface-hover)] text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] text-[11px] font-medium shrink-0 cursor-pointer">
                            {{themes.dropzone_clear}}
                        </button>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-[var(--admin-text)] mb-1.5">{{modal_or_paste}}</label>
                <textarea id="theme-json-input" name="theme_json" placeholder="{{modal_paste_placeholder}}" class="w-full bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg p-2.5 text-xs font-mono h-28 resize-none outline-none focus:border-[var(--admin-accent)] text-[var(--admin-text)]"></textarea>
            </div>

            <div id="theme-import-progress-box" class="hidden space-y-1.5 p-3 rounded-lg bg-[var(--admin-canvas)] border border-[var(--admin-border)]">
                <div class="flex justify-between items-center text-xs">
                    <span id="theme-import-status" class="font-semibold text-[var(--admin-text)]">{{import_status_preparing}}</span>
                    <span id="theme-import-percent" class="font-mono text-[var(--admin-accent-text)] font-semibold">0%</span>
                </div>
                <div class="w-full bg-[var(--admin-border)] h-1.5 rounded-full overflow-hidden">
                    <div id="theme-import-bar" class="bg-[var(--admin-accent)] h-full w-0 transition-all duration-200"></div>
                </div>
            </div>

            <div id="import-theme-msg" class="text-xs font-semibold"></div>

            <div class="flex justify-end space-x-2 pt-3 border-t border-[var(--admin-border)]">
                <button type="button" onclick="document.getElementById('import-theme-modal').classList.add('hidden')" class="h-8 px-3 rounded-lg text-xs font-medium text-[var(--admin-text-muted)] hover:bg-[var(--admin-surface-hover)] cursor-pointer">{{cancel}}</button>
                <button type="submit" id="theme-import-btn" class="h-8 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] px-4 rounded-lg text-[13px] font-semibold shadow-sm cursor-pointer">{{btn_confirm_import}}</button>
            </div>
        </form>

        <form id="theme-repo-import-form" class="hidden space-y-4" onsubmit="window.handleThemeRepoImportSubmit(event)">
            <div>
                <label class="block text-xs font-semibold text-[var(--admin-text)] mb-1">
                    <span>{{themes.repo_url_label}}</span>
                    <span class="text-red-500">*</span>
                </label>
                <input
                    type="url"
                    id="theme-repo-url"
                    required
                    placeholder="https://github.com/owner/theme-name"
                    class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-2.5 text-xs font-mono outline-none focus:border-[var(--admin-accent)] text-[var(--admin-text)]"
                />
                <p class="text-[11px] text-[var(--admin-text-muted)] mt-1">{{themes.repo_url_tip}}</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[var(--admin-text)] mb-1">{{themes.repo_branch_label}}</label>
                    <input
                        type="text"
                        id="theme-repo-branch"
                        value="main"
                        placeholder="main"
                        class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-2.5 text-xs font-mono outline-none focus:border-[var(--admin-accent)] text-[var(--admin-text)]"
                    />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[var(--admin-text)] mb-1">{{themes.repo_token_label}}</label>
                    <input
                        type="password"
                        id="theme-repo-token"
                        placeholder="{{themes.repo_token_placeholder}}"
                        class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-2.5 text-xs font-mono outline-none focus:border-[var(--admin-accent)] text-[var(--admin-text)]"
                    />
                </div>
            </div>

            <div class="p-3 bg-[var(--admin-accent-soft)] border border-[var(--admin-accent-border)] rounded-lg text-[11px] text-[var(--admin-accent-text)] space-y-1">
                <div class="font-semibold flex items-center space-x-1">
                    <span class="material-symbols-outlined text-[14px]">lock</span>
                    <span>{{themes.repo_token_cipher_title}}</span>
                </div>
                <p class="text-[10px] leading-relaxed opacity-90">{{themes.repo_token_cipher_desc}}</p>
            </div>

            <div class="flex items-center space-x-2">
                <input type="checkbox" id="theme-repo-activate" checked class="w-4 h-4 rounded accent-[var(--admin-accent)] border-[var(--admin-border)] cursor-pointer" />
                <label for="theme-repo-activate" class="text-xs font-medium text-[var(--admin-text)] cursor-pointer">{{themes.activate_immediately}}</label>
            </div>

            <div id="repo-import-msg" class="text-xs font-semibold"></div>

            <div class="flex justify-end space-x-2 pt-3 border-t border-[var(--admin-border)]">
                <button type="button" onclick="document.getElementById('import-theme-modal').classList.add('hidden')" class="h-8 px-3 rounded-lg text-xs font-medium text-[var(--admin-text-muted)] hover:bg-[var(--admin-surface-hover)] cursor-pointer">{{cancel}}</button>
                <button type="submit" id="theme-repo-import-btn" class="h-8 bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] px-4 rounded-lg text-[13px] font-semibold shadow-sm cursor-pointer flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-[16px]">cloud_download</span>
                    <span>{{themes.btn_repo_import}}</span>
                </button>
            </div>
        </form>
    </div>
</div>
