<div id="media-batch-rename-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--admin-surface)] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[var(--admin-border)] space-y-4">
        <div class="flex justify-between items-center border-b border-stone-100 dark:border-stone-700 pb-3">
            <h3 class="text-sm font-bold text-stone-900 dark:text-white">{{modal_rename_title}}</h3>
            <button type="button" onclick="closeBatchRenameModal()" class="text-stone-400 hover:text-stone-700 dark:hover:text-white cursor-pointer">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>
        <div class="space-y-3 text-xs">
            <div>
                <label class="block font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_rename_prefix}}</label>
                <input type="text" id="rename-prefix-input" placeholder="{{placeholder_rename_prefix}}" class="w-full bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 rounded-xl px-3 py-2 text-xs font-mono outline-none" />
            </div>
            <div>
                <label class="block font-bold text-stone-700 dark:text-stone-300 mb-1">{{field_rename_replace}}</label>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="rename-from-input" placeholder="{{placeholder_rename_from}}" class="bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 rounded-xl px-2.5 py-1.5 text-xs outline-none" />
                    <input type="text" id="rename-to-input" placeholder="{{placeholder_rename_to}}" class="bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 rounded-xl px-2.5 py-1.5 text-xs outline-none" />
                </div>
            </div>
        </div>
        <div class="flex justify-end space-x-2 pt-2 border-t border-stone-100 dark:border-stone-700">
            <button type="button" onclick="closeBatchRenameModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-700 cursor-pointer">{{cancel}}</button>
            <button type="button" onclick="submitBatchRename()" class="bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] px-5 py-2 rounded-xl text-xs font-bold shadow-sm cursor-pointer">{{btn_confirm_rename}}</button>
        </div>
    </div>
</div>
