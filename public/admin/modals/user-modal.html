<div id="user-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--admin-surface)] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[var(--admin-border)] space-y-4">
        <div class="flex justify-between items-center border-b border-[var(--admin-border)] pb-3">
            <h3 class="text-base font-bold text-[var(--admin-text)] flex items-center space-x-1.5">
                <span class="material-symbols-outlined text-[var(--admin-text-muted)] text-[20px]">person_add</span>
                <span>{{modal_new_title}}</span>
            </h3>
            <button type="button" onclick="closeUserModal()" class="text-[var(--admin-text-muted)] hover:text-[var(--admin-text)] cursor-pointer">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <form hx-post="/admin/users/api/create" hx-target="#user-form-feedback" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1">{{field_username}}</label>
                <input type="text" name="username" required placeholder="editor_alice" class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-3 text-xs text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)]" />
            </div>

            <div>
                <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1">{{field_email}}</label>
                <input type="email" name="email" required placeholder="alice@example.com" class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-3 text-xs text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)]" />
            </div>

            <div>
                <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1">{{field_password}}</label>
                <input type="password" name="password" required minlength="6" placeholder="{{password_placeholder_new}}" class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-3 text-xs text-[var(--admin-text)] outline-none focus:border-[var(--admin-accent)]" />
            </div>

            <div>
                <label class="block text-xs font-semibold text-[var(--admin-text-muted)] mb-1">{{field_site_role}}</label>
                <edge-select name="role" class="w-full h-8 bg-[var(--admin-canvas)] border border-[var(--admin-border)] rounded-lg px-3 text-xs font-medium text-[var(--admin-text)] outline-none">
                    <option value="admin" selected>{{role_admin}}</option>
                    <option value="visitor">{{role_visitor}}</option>
                </edge-select>
            </div>

            <div id="user-form-feedback" class="text-xs font-bold"></div>

            <div class="flex justify-end space-x-2 pt-3 border-t border-[var(--admin-border)]">
                <button type="button" onclick="closeUserModal()" class="h-8 px-3.5 rounded-lg text-xs font-semibold text-[var(--admin-text-muted)] hover:bg-[var(--admin-surface-hover)] cursor-pointer">{{cancel}}</button>
                <button type="submit" class="h-8 px-4 rounded-lg text-[13px] font-semibold bg-[var(--admin-accent)] hover:bg-[var(--admin-accent-hover)] text-[var(--admin-accent-on)] shadow-sm cursor-pointer">{{btn_confirm_add}}</button>
            </div>
        </form>
    </div>
</div>
