<div id="theme-form-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl p-6 space-y-5 animate-in fade-in duration-150">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
            <h3 id="theme-modal-title" class="text-base font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                <span class="material-symbols-outlined text-emerald-500 text-[20px]">palette</span>
                <span>{{themes.modal_title_new}}</span>
            </h3>
            <button
                type="button"
                onclick="window.closeThemeFormModal()"
                class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg"
            >
                <span class="material-symbols-outlined text-[18px]">close</span>
            </button>
        </div>

        <form id="theme-form-element" hx-post="/admin/themes/api/create" class="space-y-4">
            <input type="hidden" id="theme-form-id" name="themeId" value="" />
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{{themes.field_name}} *</label>
                <input
                    type="text"
                    id="theme-form-name"
                    name="name"
                    required
                    placeholder="{{themes.field_name_ph}}"
                    class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    oninput="window.autoFillThemeSlug && window.autoFillThemeSlug(this.value)"
                />
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{{themes.field_slug}} *</label>
                <input
                    type="text"
                    id="theme-form-slug"
                    name="slug"
                    required
                    placeholder="{{themes.field_slug_ph}}"
                    pattern="[a-z0-9_-]+"
                    class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
                <p class="text-[10px] text-slate-400 mt-1">{{themes.field_slug_tip}}</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{{themes.field_author}}</label>
                    <input
                        type="text"
                        id="theme-form-author"
                        name="author"
                        placeholder="{{themes.field_author_ph}}"
                        class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{{themes.field_version}}</label>
                    <input
                        type="text"
                        id="theme-form-version"
                        name="version"
                        value="1.0.0"
                        readonly
                        class="w-full px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-xs font-mono text-slate-500 cursor-not-allowed"
                    />
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{{themes.field_desc}}</label>
                <textarea
                    id="theme-form-description"
                    name="description"
                    rows="3"
                    placeholder="{{themes.field_desc_ph}}"
                    class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                ></textarea>
            </div>

            <div class="pt-3 flex justify-end space-x-2 border-t border-slate-100 dark:border-slate-800">
                <button
                    type="button"
                    onclick="window.closeThemeFormModal()"
                    class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                >
                    {{common.cancel}}
                </button>
                <button
                    type="submit"
                    id="theme-form-submit-btn"
                    class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm transition flex items-center space-x-1.5 cursor-pointer"
                >
                    <span class="material-symbols-outlined text-[16px]">check</span>
                    <span>{{themes.btn_create_theme}}</span>
                </button>
            </div>
        </form>
    </div>
</div>
