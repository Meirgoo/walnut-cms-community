<div id="nested-comp-picker-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-3">
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-2">
            <div class="flex items-center space-x-1.5 font-bold text-xs text-slate-900 dark:text-white">
                <span class="material-symbols-outlined text-emerald-600 text-[18px]">add_circle</span>
                <span>{{nested_modal_title}}</span>
            </div>
            <button type="button" onclick="document.getElementById('nested-comp-picker-modal')?.classList.add('hidden')" class="text-slate-400 hover:text-slate-700 dark:hover:text-white cursor-pointer">
                <span class="material-symbols-outlined text-[18px]">close</span>
            </button>
        </div>
        <div id="nested-comp-picker-list" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
    </div>
</div>
