<!DOCTYPE html>
<html lang="{{page.locale}}">
<head>
  {{edge_head}}
</head>
<body class="min-h-screen flex flex-col univers-shell-body antialiased transition-colors duration-200">
  <header data-slot="header" class="sticky top-0 z-50 w-full backdrop-blur-md univers-header-bar empty:hidden">{{slot:header:1}}</header>
  <div data-slot="subnav" class="w-full empty:hidden">{{slot:subnav:2}}</div>
  <div class="flex-1 w-full univers-page-backdrop">
    <div class="univers-shell max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-12">
      <div class="univers-shell-grid">
        <main data-slot="main" class="univers-main w-full min-w-0 space-y-14 sm:space-y-16">{{slot:main}}</main>
        <aside data-slot="sidebar" class="univers-sidebar w-full min-w-0 space-y-6 empty:hidden">{{slot:sidebar:3}}</aside>
      </div>
    </div>
  </div>
  <footer data-slot="footer" class="mt-auto univers-footer-bar empty:hidden">{{slot:footer:1}}</footer>
  {{edge_foot}}
</body>
</html>
